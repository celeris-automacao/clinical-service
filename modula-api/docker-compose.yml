services:
  postgres:
    image: postgres:15-alpine
    container_name: modula-clinic-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: modula_clinic
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d modula_clinic"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
