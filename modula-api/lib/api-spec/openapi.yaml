              doctorId: { type: integer, minimum: 1 }
              specialty: { type: string, minLength: 1 }
              quantity: { type: integer, minimum: 1 }

    UpdateCarePackageInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description: { type: ["string", "null"] }
        durationDays: { type: integer, minimum: 1 }
        priceCents: { type: integer, minimum: 0 }
        active: { type: boolean }
        promotionImages:
          type: array
          maxItems: 5
          items: { type: string }
        slots:
          type: array
          items:
            type: object
            required: [specialty, quantity]
            properties:
              doctorId: { type: integer, minimum: 1 }
              specialty: { type: string, minLength: 1 }
              quantity: { type: integer, minimum: 1 }

