openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification for the clinic management platform — Eficiência Operacional e Cuidado Integrado
servers:
  - url: /api
    description: Base API path
tags:
  - name: lgpd
    description: LGPD compliance — consent, data portability, deletion requests, and access logs
  - name: health
    description: Health operations
  - name: auth
    description: Authentication & current user
  - name: patients
    description: Patient management
  - name: doctors
    description: Doctor management
  - name: check-ins
    description: Daily check-ins (exercise, water, nutrition)
  - name: weight-entries
    description: Weekly weight tracking
  - name: sabotage-notes
    description: Self-sabotage reflection notes
  - name: conversations
    description: Internal 1:1 chat between a patient and their assigned health professionals
  - name: xp
    description: Gamification and XP points
  - name: clinic
    description: Clinic-wide dashboard & overview
  - name: storage
    description: Object storage upload and serving endpoints.
  - name: ai-analysis
    description: AI-powered calorie estimation for meals and activities.
  - name: materials
    description: Patient materials (videos, PDFs, prescriptions, meal plans) sent by medical staff.
  - name: clinic-settings
    description: Clinic plan and subscription settings.
  - name: water-entries
    description: Daily water intake tracking (multiple per day).
  - name: exercise-entries
    description: Daily exercise/workout tracking (multiple per day).
  - name: clinics
    description: Clinic management for owners and membership for patients.
  - name: admin
    description: Super admin endpoints for managing clinics, owners and enrollments.
  - name: public-page
    description: Public clinic promo/about page (content management + public rendering).
  - name: finance
    description: >-
      Clinic financials — appointment revenue, per-professional commissions,
      expenses (with receipt upload), and cash balance. clinic_owner only.
  - name: goals
    description: >-
      Custom free-text goals set for a patient by any linked health professional
      (metas customizadas por profissional de saúde), plus the patient's daily
      progress log against each goal.
  - name: community
    description: >-
      Clinic-scoped social community feed — posts (text/photo/video), likes
      and comments. Any authenticated clinic member (patient, secretaria,
      clinic_owner, profissional_saude) can post, like and comment. Moderation
      (deleting any post/comment) is limited to clinic_owner and secretaria,
      plus the original author for their own content.
  - name: contracts
    description: >-
      Patient contracts — created by clinic owners, signed online by patients
      via a finger-drawn signature. Signed contracts are read-only.
  - name: forms
    description: >-
      Customizable questionnaires (e.g. PAR-Q) created by clinic staff and
      answered by patients. Mandatory forms gate the patient's app access until
      answered.
  - name: packages
    description: >-
      Care packages (programas de atendimento) — reusable multi-specialty
      programs created by clinic owners and used to enroll patients, automatically
      linking them to the relevant professionals.
paths:
  # ─── Care Packages (Programas) ───────────────────────────────────────────────

  /public/packages/{packageId}:
    get:
      operationId: getPublicPackage
      tags: [packages]
      summary: Get an active care package for its public promotional page
      parameters:
        - name: packageId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Public care package details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCarePackage"
        "404":
          description: Package is unavailable

  /public/packages/{packageId}/contact-requests:
    post:
      operationId: createPublicPackageContactRequest
      tags: [packages]
      summary: Register interest in a care package as a clinic lead
      parameters:
        - name: packageId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicPackageInterestInput"
      responses:
        "201":
          description: Interest request received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPackageInterestResponse"
        "400":
          description: Invalid contact details
        "404":
          description: Package is unavailable
        "429":
          description: Too many requests

  /packages:
    get:
      operationId: listPackages
      tags: [packages]
      summary: List all care packages for the current clinic (clinic_owner only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of care packages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CarePackageSummary"
        "403":
          description: Forbidden
    post:
      operationId: createPackage
      tags: [packages]
      summary: Create a new care package (clinic_owner only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCarePackageInput"
      responses:
        "201":
          description: Package created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarePackageDetail"
        "400":
          description: Invalid input
        "403":
          description: Forbidden

  /packages/{packageId}:
    get:
      operationId: getPackage
      tags: [packages]
      summary: Get a care package with its slots (clinic_owner only)
      security:
        - bearerAuth: []
      parameters:
        - name: packageId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Package detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarePackageDetail"
        "403":
          description: Forbidden
        "404":
          description: Not found
    patch:
      operationId: updatePackage
      tags: [packages]
      summary: Update a care package (clinic_owner only)
      security:
        - bearerAuth: []
      parameters:
        - name: packageId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCarePackageInput"
      responses:
        "200":
          description: Updated package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarePackageDetail"
        "403":
          description: Forbidden
        "404":
          description: Not found
    delete:
      operationId: deletePackage
      tags: [packages]
      summary: Delete a care package (clinic_owner only — only if no enrollments exist)
      security:
        - bearerAuth: []
      parameters:
        - name: packageId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "403":
          description: Forbidden
        "404":
          description: Not found
        "409":
          description: Cannot delete — package has active enrollments

  /patients/{patientId}/packages:
    get:
      operationId: listPatientPackages
      tags: [packages]
      summary: List all program enrollments for a patient (clinic_owner only)
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: List of enrollments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PatientPackageDetail"
        "403":
          description: Forbidden
        "404":
          description: Not found
    post:
      operationId: enrollPatientInPackage
      tags: [packages]
      summary: Enroll a patient in a care package (clinic_owner only)
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollPatientPackageInput"
      responses:
        "201":
          description: Enrollment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientPackageDetail"
        "400":
          description: Invalid input
        "403":
          description: Forbidden
        "404":
          description: Not found

  /patients/{patientId}/packages/{enrollmentId}:
    patch:
      operationId: updatePatientPackage
      tags: [packages]
      summary: Cancel or complete a patient enrollment (clinic_owner only)
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema: { type: integer }
        - name: enrollmentId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePatientPackageInput"
      responses:
        "200":
          description: Enrollment updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientPackageDetail"
        "403":
          description: Forbidden
        "404":
          description: Not found
  # ─── Forms (Questionários) ──────────────────────────────────────────────────

  /forms:
    get:
      operationId: listForms
      tags: [forms]
      summary: List all forms for the current clinic (staff only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of forms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FormSummary"
        "403":
          description: Forbidden
    post:
      operationId: createForm
      tags: [forms]
      summary: Create a new form (clinic_owner or profissional_saude)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFormInput"
      responses:
        "201":
          description: Form created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormDetail"
        "400":
          description: Invalid input
        "403":
          description: Forbidden

  /forms/{formId}:
    get:
      operationId: getForm
      tags: [forms]
      summary: Get a form with its questions (staff only)
      security:
        - bearerAuth: []
      parameters:
        - name: formId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Form detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormDetail"
        "403":
          description: Forbidden
        "404":
          description: Not found
    put:
      operationId: updateForm
      tags: [forms]
      summary: Update a form's metadata (clinic_owner or profissional_saude)
      security:
        - bearerAuth: []
      parameters:
        - name: formId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFormInput"
      responses:
        "200":
          description: Updated form
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormDetail"
        "403":
          description: Forbidden
        "404":
          description: Not found
    delete:
      operationId: deleteForm
      tags: [forms]
      summary: Delete a form (clinic_owner only)
      security:
        - bearerAuth: []
      parameters:
        - name: formId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "403":
          description: Forbidden
        "404":
          description: Not found

  /forms/{formId}/questions:
    post:
      operationId: addFormQuestion
      tags: [forms]
      summary: Add a question to a form
      security:
        - bearerAuth: []
      parameters:
        - name: formId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFormQuestionInput"
      responses:
        "201":
          description: Question added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormQuestion"
        "400":
          description: Invalid input
        "403":
          description: Forbidden
        "404":
          description: Form not found

  /forms/{formId}/questions/{questionId}:
    patch:
      operationId: updateFormQuestion
      tags: [forms]
      summary: Update a question's text or orderIndex
      security:
        - bearerAuth: []
      parameters:
        - name: formId
          in: path
          required: true
          schema: { type: integer }
        - name: questionId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFormQuestionInput"
      responses:
        "200":
          description: Updated question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormQuestion"
        "400":
          description: Invalid input
        "403":
          description: Forbidden
        "404":
          description: Not found
    delete:
      operationId: deleteFormQuestion
      tags: [forms]
      summary: Remove a question from a form
      security:
        - bearerAuth: []
      parameters:
        - name: formId
          in: path
          required: true
          schema: { type: integer }
        - name: questionId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "403":
          description: Forbidden
        "404":
          description: Not found

  /forms/{formId}/assignments:
    post:
      operationId: assignForm
      tags: [forms]
      summary: Assign a form to a patient or to all patients in the clinic
      security:
        - bearerAuth: []
      parameters:
        - name: formId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignFormInput"
      responses:
        "201":
          description: Assignment created
          content:
            application/json:
              schema:
                type: object
                required: [id, formId, patientId]
                properties:
                  id: { type: integer }
                  formId: { type: integer }
                  patientId: { type: ["integer", "null"] }
        "403":
          description: Forbidden
        "404":
          description: Not found
        "409":
          description: Already assigned

  /patients/{patientId}/forms:
    get:
      operationId: listPatientForms
      tags: [forms]
      summary: List all forms assigned to a patient with their response status
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Forms with status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PatientFormStatus"
        "403":
          description: Forbidden
        "404":
          description: Not found

  /patients/me/forms:
    get:
      operationId: listMyForms
      tags: [forms]
      summary: List all forms assigned to the current patient (optionally filtered by mandatory+unanswered for gate check)
      security:
        - bearerAuth: []
      parameters:
        - name: mandatory
          in: query
          schema: { type: boolean }
          description: Filter to mandatory forms only
        - name: answered
          in: query
          schema: { type: boolean }
          description: Filter by answered (true) or unanswered (false)
      responses:
        "200":
          description: Forms with status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PatientFormStatus"
        "403":
          description: Forbidden

  /forms/{formId}/responses:
    post:
      operationId: submitFormResponse
      tags: [forms]
      summary: Patient submits their answers for a form
      security:
        - bearerAuth: []
      parameters:
        - name: formId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitFormResponseInput"
      responses:
        "201":
          description: Response recorded
          content:
            application/json:
              schema:
                type: object
                required: [id, formId, patientId, submittedAt]
                properties:
                  id: { type: integer }
                  formId: { type: integer }
                  patientId: { type: integer }
                  submittedAt: { type: string, format: date-time }
        "400":
          description: Invalid input
        "403":
          description: Forbidden
        "404":
          description: Not found
        "409":
          description: Already answered

  /forms/{formId}/responses/{patientId}:
    get:
      operationId: getPatientFormResponse
      tags: [forms]
      summary: Get a patient's response to a specific form (staff only)
      security:
        - bearerAuth: []
      parameters:
        - name: formId
          in: path
          required: true
          schema: { type: integer }
        - name: patientId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Patient's response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormResponseDetail"
        "403":
          description: Forbidden
        "404":
          description: Not found

  # ─── LGPD ────────────────────────────────────────────────────────────────────

  /patients/me/consent:
    get:
      operationId: getMyConsent
      tags: [lgpd]
      summary: Get current patient LGPD consent status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Consent status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentStatusResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
    post:
      operationId: grantConsent
      tags: [lgpd]
      summary: Patient grants LGPD consent
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                clinicId: { type: integer }
                purpose: { type: string }
                version: { type: string }
      responses:
        "201":
          description: Consent granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentGrantResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
    delete:
      operationId: revokeConsent
      tags: [lgpd]
      summary: Patient revokes LGPD consent
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                clinicId: { type: integer }
                purpose: { type: string }
      responses:
        "200":
          description: Consent revoked
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean }
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /patients/me/export:
    get:
      operationId: exportMyData
      tags: [lgpd]
      summary: Patient data portability export (Art. 18 LGPD)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Full personal data export as JSON attachment
          content:
            application/json:
              schema:
                type: object
                description: Personal data export bundle
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found

  /patients/me/delete-request:
    post:
      operationId: requestDataDeletion
      tags: [lgpd]
      summary: Patient submits a data deletion request (Art. 18 LGPD)
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Deletion request submitted
          content:
            application/json:
              schema:
                type: object
                required: [id, requestedAt, message]
                properties:
                  id: { type: integer }
                  requestedAt: { type: string, format: date-time }
                  message: { type: string }
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "409":
          description: A pending deletion request already exists

  /clinics/me/deletion-requests:
    get:
      operationId: listDeletionRequests
      tags: [lgpd]
      summary: Clinic owner lists patient data deletion requests
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of deletion requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeletionRequestItem"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /clinics/me/deletion-requests/{id}:
    patch:
      operationId: processDeletionRequest
      tags: [lgpd]
      summary: Clinic owner approves or cancels a deletion request
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [approve, cancel] }
                notes: { type: string }
      responses:
        "200":
          description: Request processed
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: { type: integer }
                  status: { type: string, enum: [approved, cancelled] }
                  approvedAt: { type: ["string", "null"], format: date-time }
                  cancelledAt: { type: ["string", "null"], format: date-time }
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "409":
          description: Request already processed

  /clinics/me/access-logs:
    get:
      operationId: getAccessLogs
      tags: [lgpd]
      summary: Clinic owner views data access audit log
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: query
          schema: { type: integer }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Access log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccessLogItem"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /clinics/me/audit-failures:
    get:
      operationId: getAuditFailures
      tags: [lgpd]
      summary: Clinic owner views failed LGPD audit write records
      description: Returns the count and most recent unresolved failed audit write attempts for the clinic. A failure means a data-access log could not be persisted after all retries — a compliance gap under LGPD Art. 37.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Audit failure summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditFailuresSummary"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /clinics/me/audit-failures/{id}/resolve:
    patch:
      operationId: resolveAuditFailure
      tags: [lgpd]
      summary: Clinic owner marks an audit failure as investigated/resolved
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Failure marked as resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditFailureItem"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "409":
          description: Already resolved

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Auth ───────────────────────────────────────────────────────────────────

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user with role
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized

  /auth/request-access:
    post:
      operationId: requestAccess
      tags: [auth]
      summary: Request a temporary password by email (patients only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: Always returned — does not reveal whether the email exists
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /auth/resend-access:
    post:
      operationId: resendAccess
      tags: [auth]
      summary: Resend a temporary password email to a patient (rate-limited)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: Always returned — does not reveal whether the email exists
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: JWT token + user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /auth/social-login:
    post:
      operationId: socialLogin
      tags: [auth]
      summary: Login via Google or Apple OAuth token (patients only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocialLoginInput"
      responses:
        "200":
          description: JWT token + user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "403":
          description: Email not authorized (not a registered patient)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Invalid social token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new staff account (doctor or clinic_owner)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the current refresh token and clear the session cookie
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean }

  /auth/logout-all:
    post:
      operationId: logoutAll
      tags: [auth]
      summary: Revoke all active refresh tokens for the current user (sign out all devices)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All sessions revoked successfully
          content:
            application/json:
              schema:
                type: object
                required: [success, revokedCount]
                properties:
                  success: { type: boolean }
                  revokedCount: { type: integer }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized or wrong current password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request a password reset email (clinic staff only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: Reset email sent (always 200 to prevent enumeration)
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean }

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Reset password using a one-time token from the reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Password reset successfully
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean }
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /auth/complete-profile:
    post:
      operationId: completeProfile
      tags: [auth]
      summary: Set or update the current user role and profile info after signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /users/me:
    patch:
      operationId: updateMe
      tags: [auth]
      summary: Update the current authenticated user's own profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeInput"
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
        "403":
          description: Only clinic owners can update owner identification fields
        "409":
          description: Email or CPF is already in use

  # ─── Patients ───────────────────────────────────────────────────────────────

  /patients/me/push-token:
    patch:
      operationId: updateMyPushToken
      tags: [patients]
      summary: Register (or clear) the current patient's Expo push token, used as a server-side fallback for appointment reminders when the app has been closed for a long time.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushTokenInput"
      responses:
        "200":
          description: Push token saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
        "404":
          description: Authenticated user is not a patient

  /patients/me/reminder-settings:
    patch:
      operationId: updateMyReminderSettings
      tags: [patients]
      summary: Sync the current patient's local water/weigh-in reminder settings (enabled, time, frequency) to the server, so clinic staff can see them on the web cockpit. Scheduling itself stays fully local on the phone; this endpoint only updates server-side visibility.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientReminderSettingsInput"
      responses:
        "200":
          description: Reminder settings saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientReminderSettings"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
        "404":
          description: Authenticated user is not a patient

  /patients:
    get:
      operationId: listPatients
      tags: [patients]
      summary: List patients (owner sees all; doctor sees assigned only)
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: doctorId
          in: query
          schema: { type: integer }
        - name: unassigned
          in: query
          schema: { type: boolean }
          description: If true, return only patients with no doctor assigned
        - name: activeThisWeek
          in: query
          schema: { type: boolean }
          description: If true, return only patients with a check-in during the current week
      responses:
        "200":
          description: List of patients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Patient"
    post:
      operationId: createPatient
      tags: [patients]
      summary: Register a new patient (clinic owner or doctor). When created by a doctor, the patient is automatically assigned to that doctor. Optionally assign additional professionals from the same clinic at creation time via additionalDoctorIds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientInput"
      responses:
        "201":
          description: Created patient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"

  /patients/me/treatments:
    get:
      operationId: getMyTreatments
      tags: [patients]
      summary: List the current patient's active treatments grouped by clinic
      responses:
        "200":
          description: Active treatment enrollments grouped by clinic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientTreatmentsResponse"
        "403":
          description: Only patients can view their treatments
        "404":
          description: Patient profile not found

  /patients/{patientId}/resend-invite:
    post:
      operationId: resendPatientInvite
      tags: [patients]
      summary: Generate a new temporary password and resend the invite email to the patient
      parameters:
        - name: patientId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Invite email sent (or queued)
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean }
        "403":
          description: Forbidden
        "404":
          description: Patient not found

  /patients/{patientId}/access-token:
    post:
      operationId: generatePatientAccessToken
      tags: [patients]
      summary: Generate a new mobile app access token for a patient (clinic owner)
      parameters:
        - name: patientId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Generated access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessToken"
        "404":
          description: Not found

  /patients/{patientId}:
    get:
      operationId: getPatient
      tags: [patients]
      summary: Get patient details
      parameters:
        - name: patientId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Patient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "404":
          description: Not found
    patch:
      operationId: updatePatient
      tags: [patients]
      summary: Update patient info
      parameters:
        - name: patientId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientUpdate"
      responses:
        "200":
          description: Updated patient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"

  /patients/{patientId}/weight-goal:
    patch:
      operationId: proposeWeightGoal
      tags: [patients]
      summary: Propose or update a weight goal (patient only) — sets status to pending
      parameters:
        - name: patientId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeightGoalInput"
      responses:
        "200":
          description: Updated patient with pending weight goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found

  /patients/{patientId}/weight-goal/validate:
    post:
      operationId: validateWeightGoal
      tags: [patients]
      summary: Approve or reject a patient's pending weight goal (doctor or clinic owner)
      parameters:
        - name: patientId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeightGoalValidation"
      responses:
        "200":
          description: Updated patient with validated/rejected weight goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
        "409":
          description: No pending weight goal to validate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /patients/{patientId}/summary:
    get:
      operationId: getPatientSummary
      tags: [patients]
      summary: Get patient progress summary (weight loss, XP, streaks, goal completion rate)
      parameters:
        - name: patientId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Patient summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientSummary"

  /patients/{patientId}/doctors:
    get:
      operationId: getPatientDoctors
      tags: [patients]
      summary: Get doctors assigned to a patient
      parameters:
        - name: patientId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Assigned doctors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Doctor"
    post:
      operationId: assignDoctor
      tags: [patients]
      summary: Assign a doctor to a patient
      parameters:
        - name: patientId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DoctorAssignmentInput"
      responses:
        "201":
          description: Assignment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoctorAssignment"

  /patients/{patientId}/goals:
    get:
      operationId: listGoals
      tags: [goals]
      summary: >-
        List all goals for a patient. Visible to any health professional
        linked to the patient, the clinic owner, or the patient themselves.
      parameters:
        - name: patientId
          in: path
          required: true
          schema: { type: integer }
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/GoalStatus"
          description: Optional filter by status (defaults to returning all statuses)
      responses:
        "200":
          description: List of goals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goal"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
    post:
      operationId: createGoal
      tags: [goals]
      summary: >-
        Create a custom goal for a patient. Any health professional linked to
        the patient (via patient_doctors) may create one.
      parameters:
        - name: patientId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalInput"
      responses:
        "201":
          description: Goal created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found

  /goals/{goalId}:
    patch:
      operationId: updateGoal
      tags: [goals]
      summary: Update a goal. Only its creator or the clinic owner may edit it.
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalUpdate"
      responses:
        "200":
          description: Updated goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
    delete:
      operationId: deleteGoal
      tags: [goals]
      summary: Delete a goal. Only its creator or the clinic owner may delete it.
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Goal deleted
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found

  /patients/me/goals/unread-count:
    get:
      operationId: getUnreadGoalCount
      tags: [goals]
      summary: >-
        Returns the number of goals created or significantly updated since the
        patient last viewed their goals screen. Always 0 for non-patient callers.
      responses:
        "200":
          description: Unread goal count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadGoalCount"
        "401":
          description: Unauthorized

  /patients/me/goals/mark-seen:
    post:
      operationId: markGoalsSeen
      tags: [goals]
      summary: >-
        Records that the patient has viewed their goals list, resetting the
        unread count to zero. No-op for non-patient callers.
      responses:
        "204":
          description: Marked as seen
        "401":
          description: Unauthorized

  /goals/{goalId}/progress:
    get:
      operationId: listGoalProgress
      tags: [goals]
      summary: >-
        List the daily progress history for a goal, most recent first.
        Visible to anyone with access to the patient.
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: integer }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 60, minimum: 1, maximum: 365 }
      responses:
        "200":
          description: Progress entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GoalProgress"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
    post:
      operationId: logGoalProgress
      tags: [goals]
      summary: >-
        Log (create or update) the patient's progress for a goal on a given
        date. Patient only — one entry per goal per day (upsert by date).
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalProgressInput"
      responses:
        "200":
          description: Progress entry created or updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalProgress"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found

  /patients/{patientId}/nutrition-goals:
    get:
      operationId: getNutritionGoals
      tags: [patients]
      summary: Get nutrition goals for a patient
      parameters:
        - name: patientId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Nutrition goals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NutritionGoals"
        "404":
          description: Patient not found
    put:
      operationId: updateNutritionGoals
      tags: [patients]
      summary: Set nutrition goals for a patient. Health staff (clinic_owner/profissional_saude) may set any field; a patient may only set their own dailyCalorieGoal.
      parameters:
        - name: patientId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NutritionGoalsInput"
      responses:
        "200":
          description: Updated nutrition goals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NutritionGoals"
        "403":
          description: Forbidden
        "404":
          description: Patient not found

  /patients/{patientId}/doctors/{doctorId}:
    delete:
      operationId: removeDoctor
      tags: [patients]
      summary: Remove a doctor assignment from a patient
      parameters:
        - name: patientId
          in: path
          required: true
          schema: { type: integer }
        - name: doctorId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Removed

  /patients/upcoming-birthdays:
    get:
      operationId: listUpcomingBirthdays
      tags: [patients]
      summary: List patients whose birthday falls within the next N days
      parameters:
        - name: days
          in: query
          schema: { type: integer, default: 7, minimum: 1, maximum: 365 }
          description: Number of days ahead to look (default 7)
      responses:
        "200":
          description: List of patients with upcoming birthdays
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UpcomingBirthday"
        "403":
          description: Forbidden

  # ─── Doctors ────────────────────────────────────────────────────────────────

  /doctors:
    get:
      operationId: listDoctors
      tags: [doctors]
      summary: List all doctors in the clinic
      responses:
        "200":
          description: Doctors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Doctor"
    post:
      operationId: createDoctor
      tags: [doctors]
      summary: Add a new doctor (clinic owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DoctorInput"
      responses:
        "201":
          description: Doctor created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Doctor"

  /doctors/{doctorId}:
    patch:
      operationId: updateDoctor
      tags: [doctors]
      summary: Update doctor info
      parameters:
        - name: doctorId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DoctorUpdate"
      responses:
        "200":
          description: Updated doctor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Doctor"
    delete:
      operationId: deleteDoctor
      tags: [doctors]
      summary: Remove a doctor (clinic owner only)
      parameters:
        - name: doctorId
          in: path
          required: true
          schema: { type: integer }
        - name: force
          in: query
          required: false
          schema: { type: boolean }
          description: If true, remove the doctor even if they have assigned patients
      responses:
        "204":
          description: Deleted
        "409":
          description: Doctor has assigned patients; pass force=true to override
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  patientCount:
                    type: integer
                required: [error, patientCount]

  /doctors/{doctorId}/reviews:
    get:
      operationId: getDoctorReviews
      tags: [doctors]
      summary: Get a doctor's rating summary and reviews (visible within the clinic)
      parameters:
        - name: doctorId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Reviews summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoctorReviews"
        "403":
          description: Forbidden
        "404":
          description: Doctor not found

  /secretaries:
    get:
      operationId: listSecretaries
      tags: [secretaries]
      summary: List all secretaries in the clinic (clinic owner, doctors, and secretaries)
      responses:
        "200":
          description: Secretaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Secretary"
    post:
      operationId: createSecretary
      tags: [secretaries]
      summary: Add a new secretary (clinic owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecretaryInput"
      responses:
        "201":
          description: Secretary created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Secretary"
        "403":
          description: Forbidden

  /secretaries/{secretaryId}:
    patch:
      operationId: updateSecretary
      tags: [secretaries]
      summary: Update a secretary's name, email, password, or status (clinic owner only)
      parameters:
        - name: secretaryId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSecretaryInput"
      responses:
        "200":
          description: Updated secretary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Secretary"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Forbidden
        "404":
          description: Secretary not found
    delete:
      operationId: deleteSecretary
      tags: [secretaries]
      summary: Remove a secretary (clinic owner only)
      parameters:
        - name: secretaryId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "403":
          description: Forbidden
        "404":
          description: Secretary not found

  /doctors/{doctorId}/reassign-patients:
    post:
      operationId: reassignDoctorPatients
      tags: [doctors]
      summary: Reassign all patients from one doctor to another (clinic owner only)
      parameters:
        - name: doctorId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReassignPatientsInput"
      responses:
        "200":
          description: Reassigned successfully
          content:
            application/json:
              schema:
                type: object
                required: [reassignedCount]
                properties:
                  reassignedCount:
                    type: integer
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Doctor not found

  # ─── Agenda / Appointments ───────────────────────────────────────────────────

  /doctors/{doctorId}/availability:
    get:
      operationId: getDoctorAvailability
      tags: [appointments]
      summary: List a doctor's recurring weekly availability windows and lunch breaks
      parameters:
        - name: doctorId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Weekly availability windows and lunch breaks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilitySettings"
        "403":
          description: Forbidden
    put:
      operationId: setDoctorAvailability
      tags: [appointments]
      summary: Replace the weekly availability windows and lunch breaks for a professional
      parameters:
        - name: doctorId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetAvailabilityInput"
      responses:
        "200":
          description: Updated availability windows and lunch breaks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilitySettings"
        "400":
          description: Invalid input
        "403":
          description: Forbidden

  /doctors/{doctorId}/slots:
    get:
      operationId: getDoctorSlots
      tags: [appointments]
      summary: Get free/busy slots for a doctor on a given date
      parameters:
        - name: doctorId
          in: path
          required: true
          schema: { type: integer }
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Slots for the requested date
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Slot"
        "403":
          description: Forbidden

  /appointments:
    get:
      operationId: listAppointments
      tags: [appointments]
      summary: List appointments visible to the caller (own for patients/professionals, clinic-wide for clinic owners)
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [scheduled, cancelled, completed]
        - name: doctorId
          in: query
          required: false
          description: Restrict results to a specific professional. Only honored for clinic owners.
          schema: { type: integer }
      responses:
        "200":
          description: Appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Appointment"
    post:
      operationId: createAppointment
      tags: [appointments]
      summary: Book a new appointment (patient only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAppointmentInput"
      responses:
        "201":
          description: Appointment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "400":
          description: Invalid input
        "403":
          description: Forbidden
        "409":
          description: Slot no longer available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /appointments/{appointmentId}:
    patch:
      operationId: updateAppointment
      tags: [appointments]
      summary: Update an existing appointment (professional, date, time and/or status). Only clinic staff (secretaria, clinic_owner) and the assigned professional may reschedule/reassign; the same availability/conflict checks used when creating an appointment are re-applied.
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAppointmentInput"
      responses:
        "200":
          description: Appointment updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "400":
          description: Invalid input
        "403":
          description: Forbidden
        "404":
          description: Appointment not found
        "409":
          description: Slot no longer available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: cancelAppointment
      tags: [appointments]
      summary: Cancel an appointment (patient or the assigned professional)
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Cancelled
        "403":
          description: Forbidden
        "404":
          description: Appointment not found

  /appointments/{appointmentId}/review:
    post:
      operationId: createAppointmentReview
      tags: [appointments]
      summary: Rate a completed appointment (patient only, one review per appointment)
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAppointmentReviewInput"
      responses:
        "201":
          description: Review created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentReview"
        "400":
          description: Invalid input
        "403":
          description: Forbidden
        "404":
          description: Appointment not found
        "409":
          description: Appointment already reviewed, or not yet completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  # ─── Daily Check-ins ─────────────────────────────────────────────────────────

  /check-ins:
    get:
      operationId: listCheckIns
      tags: [check-ins]
      summary: List daily check-ins
      parameters:
        - name: patientId
          in: query
          schema: { type: integer }
        - name: startDate
          in: query
          schema: { type: string, format: date }
        - name: endDate
          in: query
          schema: { type: string, format: date }
        - name: limit
          in: query
          schema: { type: integer, default: 30 }
          description: >
            Maximum number of results. Defaults to 30 when no date range is
            given. When both startDate and endDate are provided the default
            limit is removed and all check-ins in the range are returned
            unless an explicit limit is specified.
      responses:
        "200":
          description: Check-ins
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CheckIn"
    post:
      operationId: createCheckIn
      tags: [check-ins]
      summary: Submit a daily check-in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckInInput"
      responses:
        "201":
          description: Check-in created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckIn"

  /check-ins/{checkInId}:
    get:
      operationId: getCheckIn
      tags: [check-ins]
      summary: Get a single check-in
      parameters:
        - name: checkInId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Check-in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckIn"
    patch:
      operationId: updateCheckIn
      tags: [check-ins]
      summary: Update a check-in (same day only)
      parameters:
        - name: checkInId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckInUpdate"
      responses:
        "200":
          description: Updated check-in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckIn"

  # ─── Weight Entries ──────────────────────────────────────────────────────────

  /weight-entries:
    get:
      operationId: listWeightEntries
      tags: [weight-entries]
      summary: List weight entries
      parameters:
        - name: patientId
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer, default: 52 }
      responses:
        "200":
          description: Weight entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WeightEntry"
    post:
      operationId: createWeightEntry
      tags: [weight-entries]
      summary: Record weekly weight (patients — once per week)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeightEntryInput"
      responses:
        "201":
          description: Weight entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeightEntry"

  /weight-entries/{entryId}:
    get:
      operationId: getWeightEntry
      tags: [weight-entries]
      summary: Get a single weight entry
      parameters:
        - name: entryId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Weight entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeightEntry"
    patch:
      operationId: updateWeightEntry
      tags: [weight-entries]
      summary: Correct the weight value for an existing entry (patient-owned)
      parameters:
        - name: entryId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeightEntryUpdate"
      responses:
        "200":
          description: Updated weight entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeightEntry"

  # ─── Sabotage Notes ──────────────────────────────────────────────────────────

  /sabotage-notes:
    get:
      operationId: listSabotageNotes
      tags: [sabotage-notes]
      summary: List sabotage reflection notes
      parameters:
        - name: patientId
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Sabotage notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SabotageNote"
    post:
      operationId: createSabotageNote
      tags: [sabotage-notes]
      summary: Add a sabotage reflection note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SabotageNoteInput"
      responses:
        "201":
          description: Sabotage note created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SabotageNote"

  # ─── Chat / Conversations ──────────────────────────────────────────────────

  /conversations:
    get:
      operationId: listConversations
      tags: [conversations]
      summary: List the caller's conversations (patient sees theirs, professional sees their patients')
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
    post:
      operationId: createConversation
      tags: [conversations]
      summary: Start (or fetch) a conversation. Patients/professionals use the assigned patient-doctor pair; a secretaria may start a conversation with any professional, clinic owner, or patient in her own clinic via otherUserId.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationInput"
      responses:
        "201":
          description: Conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"

  /conversations/recipients:
    get:
      operationId: listConversationRecipients
      tags: [conversations]
      summary: List professionals, clinic owners and patients of the secretaria's own clinic, for the "new conversation" picker
      responses:
        "200":
          description: Available recipients
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationRecipients"

  /conversations/unread-count:
    get:
      operationId: getUnreadMessageCount
      tags: [conversations]
      summary: Total unread message count across all of the caller's conversations
      responses:
        "200":
          description: Unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCount"

  /conversations/{conversationId}/messages:
    get:
      operationId: listMessages
      tags: [conversations]
      summary: List messages in a conversation (oldest first)
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: beforeId
          in: query
          description: Return messages with id less than this (for pagination)
          schema: { type: integer }
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendMessage
      tags: [conversations]
      summary: Send a message in a conversation
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Message created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /conversations/{conversationId}/attachments:
    post:
      operationId: uploadConversationAttachment
      tags: [conversations]
      summary: Upload an attachment for a conversation
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: integer }
        - name: x-file-name
          in: header
          required: true
          schema: { type: string, maxLength: 255 }
        - name: x-file-content-type
          in: header
          required: true
          schema: { type: string, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Attachment uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageAttachment"

  /conversations/{conversationId}/messages/{messageId}/attachments/{attachmentIndex}:
    get:
      operationId: downloadConversationAttachment
      tags: [conversations]
      summary: Download a file attached to a message in an accessible conversation
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: integer }
        - name: messageId
          in: path
          required: true
          schema: { type: integer }
        - name: attachmentIndex
          in: path
          required: true
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Attachment file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /conversations/{conversationId}/read:
    post:
      operationId: markConversationRead
      tags: [conversations]
      summary: Mark all messages in a conversation (not sent by the caller) as read
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Marked as read
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean }

  # ─── Community feed ─────────────────────────────────────────────────────────

  /community/uploads:
    post:
      operationId: uploadCommunityAttachment
      tags: [community]
      summary: Upload a file, photo or video to the community
      parameters:
        - name: X-File-Name
          in: header
          required: true
          schema: { type: string, maxLength: 255 }
        - name: X-File-Content-Type
          in: header
          required: true
          schema: { type: string, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Community attachment uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityUpload"

  /community/media:
    get:
      operationId: getCommunityLocalMedia
      tags: [community]
      summary: Read a locally stored community attachment for the caller's clinic
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Attachment bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }

  /community/posts:
    get:
      operationId: listCommunityPosts
      tags: [community]
      summary: List the caller's clinic community feed (newest first)
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: beforeId
          in: query
          description: Return posts with id less than this (for pagination)
          schema: { type: integer }
      responses:
        "200":
          description: Community posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommunityPost"
    post:
      operationId: createCommunityPost
      tags: [community]
      summary: Create a community post (text and/or an attachment). At least one of content or mediaUrl is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityPostInput"
      responses:
        "201":
          description: Post created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityPost"

  /community/posts/{postId}:
    delete:
      operationId: deleteCommunityPost
      tags: [community]
      summary: Delete a community post. Allowed for the post's author, or clinic_owner/secretaria of the clinic (moderation).
      parameters:
        - name: postId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean }

  /community/posts/{postId}/like:
    post:
      operationId: toggleCommunityPostLike
      tags: [community]
      summary: Toggle the caller's like on a post (like if not liked, unlike if already liked)
      parameters:
        - name: postId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Updated like state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityLikeState"

  /community/posts/{postId}/comments:
    get:
      operationId: listCommunityComments
      tags: [community]
      summary: List comments on a post (oldest first)
      parameters:
        - name: postId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommunityComment"
    post:
      operationId: createCommunityComment
      tags: [community]
      summary: Add a text or attachment comment to a post
      parameters:
        - name: postId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityCommentInput"
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityComment"

  /community/notification-preferences:
    get:
      operationId: getCommunityNotificationPreferences
      tags: [community]
      summary: Get the caller's community notification preferences
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityNotificationPreferences"
    patch:
      operationId: updateCommunityNotificationPreferences
      tags: [community]
      summary: Update the caller's community notification preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityNotificationPreferencesInput"
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityNotificationPreferences"

  /community/comments/{commentId}:
    delete:
      operationId: deleteCommunityComment
      tags: [community]
      summary: Delete a comment. Allowed for the comment's author, or clinic_owner/secretaria of the clinic (moderation).
      parameters:
        - name: commentId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [success, authorNotified]
                properties:
                  success: { type: boolean }
                  authorNotified: { type: boolean, description: "Whether the removed comment's author was notified by email" }

  /community/posts/{postId}/report:
    post:
      operationId: reportCommunityPost
      tags: [community]
      summary: Report a community post as inappropriate
      parameters:
        - name: postId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityReportInput"
      responses:
        "201":
          description: Report submitted
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean }

  /community/comments/{commentId}/report:
    post:
      operationId: reportCommunityComment
      tags: [community]
      summary: Report a community comment as inappropriate
      parameters:
        - name: commentId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
