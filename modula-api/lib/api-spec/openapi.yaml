      security:
        - bearerAuth: []
      parameters:
        - name: leadId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Lead deleted
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Lead not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /leads/{leadId}/stage:
    patch:
      operationId: updateLeadStage
      tags: [leads]
      summary: Move a lead to a new pipeline stage (owner/doctor/secretary only)
      security:
        - bearerAuth: []
      parameters:
        - name: leadId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadStageInput"
      responses:
        "200":
          description: Lead with updated stage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Lead not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  # ─── Finance ─────────────────────────────────────────────────────────────────

  /finance/revenue:
    get:
      operationId: getFinanceRevenue
      tags: [finance]
      summary: Appointment revenue for a period, broken down by payment type and paid/pending (clinic_owner only)
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          required: true
          schema: { type: string, description: "YYYY-MM" }
      responses:
        "200":
          description: Revenue summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceRevenue"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /finance/commissions:
    get:
      operationId: getFinanceCommissions
      tags: [finance]
      summary: Per-professional commission breakdown for a period (clinic_owner only)
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          required: true
          schema: { type: string, description: "YYYY-MM" }
      responses:
        "200":
          description: Commission per professional
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommissionItem"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /finance/summary:
    get:
      operationId: getFinanceSummary
      tags: [finance]
      summary: Cash balance (revenue - expenses) for a period (clinic_owner only)
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          required: true
          schema: { type: string, description: "YYYY-MM" }
      responses:
        "200":
          description: Financial summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceSummary"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /finance/expenses:
    get:
      operationId: listExpenses
      tags: [finance]
      summary: List expenses for a period (clinic_owner only)
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          required: false
          schema: { type: string, description: "YYYY-MM; omit to list all periods" }
      responses:
        "200":
          description: Expenses ordered newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Expense"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: createExpense
      tags: [finance]
      summary: Log a new expense (clinic_owner only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseInput"
      responses:
        "201":
          description: Expense created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /finance/expenses/{expenseId}:
    patch:
      operationId: updateExpense
      tags: [finance]
      summary: Update an expense (clinic_owner only)
      security:
        - bearerAuth: []
      parameters:
        - name: expenseId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseUpdateInput"
      responses:
        "200":
          description: Updated expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Expense not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: deleteExpense
      tags: [finance]
      summary: Delete an expense (clinic_owner only)
      security:
        - bearerAuth: []
      parameters:
        - name: expenseId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Expense deleted
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Expense not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  # ─── Contracts ───────────────────────────────────────────────────────────────

  /patients/{patientId}/contracts:
    get:
      operationId: listPatientContracts
      tags: [contracts]
      summary: List contracts for a patient (clinic staff + patient self)
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: List of contracts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contract"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Patient not found
    post:
      operationId: createPatientContract
      tags: [contracts]
      summary: Create a contract for a patient (clinic_owner only)
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContractInput"
      responses:
        "201":
          description: Contract created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Patient not found

  /contracts/{id}:
    get:
      operationId: getContract
      tags: [contracts]
      summary: Get contract detail (clinic staff + patient self)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Contract detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Contract not found
    delete:
      operationId: deleteContract
      tags: [contracts]
      summary: Soft-delete a contract (clinic_owner only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Contract deleted
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Contract not found

  /contracts/{id}/sign:
    post:
      operationId: signContract
      tags: [contracts]
      summary: Patient submits a finger-drawn signature to sign a contract
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignContractInput"
      responses:
        "200":
          description: Contract signed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"
        "400":
          description: Already signed or invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (not the patient this contract belongs to)
        "404":
          description: Contract not found

components:
  schemas:

    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    # ── User / Auth ────────────────────────────────────────────────────────────

    UserProfile:
      type: object
      required: [id, email, name, role, createdAt]
      properties:
        id: { type: integer }
        clerkId: { type: ["string", "null"] }
        email: { type: string }
        name: { type: string }
        role:
          type: string
          enum: [patient, profissional_saude, clinic_owner, super_admin, secretaria]
        avatarUrl: { type: ["string", "null"] }
        isTemporaryPassword: { type: boolean }
        createdAt: { type: string, format: date-time }
        patientId: { type: ["integer", "null"], description: "ID in patients table (only for role=patient)" }
        cpf: { type: ["string", "null"], description: "CPF do usuário (formato XXX.XXX.XXX-XX)" }
        rg: { type: ["string", "null"], description: "RG do usuário" }
        phone: { type: ["string", "null"], description: "Telefone de contato" }
        birthDate: { type: ["string", "null"], format: date, description: "Data de nascimento (ISO date)" }

    PushTokenInput:
      type: object
      required: [pushToken]
      properties:
        pushToken:
          type: ["string", "null"]
          description: Expo push token (e.g. ExponentPushToken[...]), or null to clear a previously-registered token (e.g. on logout).

    UpdateMeInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, format: email }
        avatarUrl:
          type: ["string", "null"]
          description: "Object-storage path (e.g. /objects/…) or null to clear the avatar"
        cpf: { type: ["string", "null"], description: "CPF do owner; null para remover" }
        rg: { type: ["string", "null"], description: "RG do owner; null para remover" }
        phone: { type: ["string", "null"], description: "Telefone do owner; null para remover" }
        birthDate: { type: ["string", "null"], format: date, description: "Data de nascimento do owner (ISO date); null para remover" }

    ProfileInput:
      type: object
      required: [name, role]
      properties:
        name: { type: string, minLength: 1 }
        role:
          type: string
          enum: [patient, profissional_saude, clinic_owner]
        avatarUrl: { type: string }

    SocialLoginInput:
      type: object
      required: [provider, token]
      properties:
        provider:
          type: string
          enum: [google, apple]
        token:
          type: string
          description: Access token (Google) or identity token JWT (Apple)
        appleUserId:
          type: string
          description: Apple's stable user identifier (for subsequent Apple sign-ins)
        email:
          type: string
          description: Email hint (Apple first sign-in only)

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }

    RegisterInput:
      type: object
      required: [email, password, name, role]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 6 }
        name: { type: string, minLength: 1 }
        role:
          type: string
          enum: [profissional_saude, clinic_owner]
        specialty:
          type: string
          minLength: 1
          maxLength: 100
        cpf:
          type: string
          description: "CPF do usuário (formato XXX.XXX.XXX-XX) — obrigatório para clinic_owner"
          pattern: '^\d{3}\.\d{3}\.\d{3}-\d{2}$'
        rg:
          type: string
          description: "RG do usuário (opcional)"
        phone:
          type: string
          description: "Telefone de contato (opcional)"
        birthDate:
          type: string
          format: date
          description: "Data de nascimento em formato ISO (YYYY-MM-DD) — opcional"
        avatarUrl: { type: string }

    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token: { type: string }
        user:
          type: object
          required: [id, email, name, role]
          properties:
            id: { type: integer }
            email: { type: string }
            name: { type: string }
            role:
              type: string
              enum: [patient, profissional_saude, clinic_owner, secretaria]
            isTemporaryPassword: { type: boolean }

    ChangePasswordInput:
      type: object
      required: [newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 6 }

    # ── Patient ───────────────────────────────────────────────────────────────

    Patient:
      type: object
      required: [id, userId, name, email, startWeight, createdAt]
      properties:
        id: { type: integer }
        userId: { type: integer }
        name: { type: string }
        email: { type: string }
        avatarUrl: { type: ["string", "null"] }
        dateOfBirth: { type: ["string", "null"], format: date }
        startWeight: { type: number, description: "Initial weight in kg" }
        targetWeight: { type: ["number", "null"], description: "Goal weight in kg (validated goal currently in effect)" }
        proposedTargetWeight: { type: ["number", "null"], description: "Goal weight proposed by the patient, pending doctor validation" }
        weightGoalStatus:
          type: string
          enum: [none, pending, validated, rejected]
          description: "Status of the proposed weight goal: none = never proposed, pending = awaiting doctor validation, validated = approved and applied to targetWeight, rejected = declined by a doctor"
        weightGoalValidatedByName: { type: ["string", "null"], description: "Name of the doctor who validated or rejected the goal" }
        weightGoalValidatedAt: { type: ["string", "null"], format: date-time }
        currentWeight: { type: ["number", "null"], description: "Most recent recorded weight" }
        totalXp: { type: integer, default: 0 }
        isTemporaryPassword: { type: boolean, description: "True when the patient has not yet changed their temporary password" }
        temporaryPasswordExpiresAt: { type: ["string", "null"], format: date-time, description: "When the temporary password expires; null if never set. Combined with isTemporaryPassword=true and a past date, indicates a stale/expired invite." }
        dailyCalorieGoal: { type: ["integer", "null"], description: "Personalized daily calorie goal set by health professional (kcal)" }
        allergies: { type: ["string", "null"], description: "Free-text allergies reported by the patient" }
        hasAllergies: { type: boolean, default: false, description: "Whether the patient reports having allergies" }
        medicalConditions: { type: ["string", "null"], description: "Free-text relevant medical conditions reported by the patient" }
        dietaryRestrictions: { type: ["string", "null"], description: "Free-text dietary restrictions (e.g. vegetarian, lactose-free), shared with NutritionGoals.dietaryRestrictions" }
        hasDietaryRestrictions: { type: boolean, default: false, description: "Whether the patient reports having dietary restrictions" }
        psychologyNotes: { type: ["string", "null"], description: "Free-text notes for the psychology specialty" }
        physicalActivityNotes: { type: ["string", "null"], description: "Free-text notes for the physical activity / physical educator specialty" }
        endocrinologyNotes: { type: ["string", "null"], description: "Free-text notes for the endocrinology specialty" }
        phone: { type: ["string", "null"], description: "Patient's phone number, editable by the patient or authorized clinic staff" }
        cpf: { type: ["string", "null"], description: "CPF do paciente" }
        rg: { type: ["string", "null"], description: "RG do paciente" }
        addressStreet: { type: ["string", "null"], description: "Logradouro" }
        addressNumber: { type: ["string", "null"], description: "Número" }
        addressComplement: { type: ["string", "null"], description: "Complemento" }
        addressNeighborhood: { type: ["string", "null"], description: "Bairro" }
        addressCity: { type: ["string", "null"], description: "Cidade" }
        addressState: { type: ["string", "null"], description: "Estado (UF)" }
        addressZip: { type: ["string", "null"], description: "CEP" }
        paymentType:
          $ref: "#/components/schemas/PaymentType"
        insuranceName: { type: ["string", "null"], description: "Free-text convênio (health insurance) name, only meaningful when paymentType is convenio" }
        createdAt: { type: string, format: date-time }
        careTeam:
          type: array
          description: "Every health professional currently linked to this patient via patient_doctors, regardless of who created the link. Visible to any professional authorized to view the patient."
          items:
            $ref: "#/components/schemas/CareTeamMember"
        reminderSettings:
          $ref: "#/components/schemas/PatientReminderSettings"

    PatientReminderSettings:
      type: object
      description: "The patient's mobile app reminder settings, synced from device. Null fields mean the patient has never opened the reminders section on mobile (not configured yet)."
      properties:
        water:
          $ref: "#/components/schemas/ReminderSetting"
        weight:
          $ref: "#/components/schemas/ReminderSetting"

    ReminderSetting:
      type: object
      properties:
        enabled: { type: ["boolean", "null"] }
        hour: { type: ["integer", "null"], minimum: 0, maximum: 23 }
        minute: { type: ["integer", "null"], minimum: 0, maximum: 59 }
        frequency: { type: ["integer", "null"], description: "For water: hours between reminders. For weight: days between reminders." }

    ReminderSettingInput:
      type: object
      properties:
        enabled: { type: boolean }
        hour: { type: integer, minimum: 0, maximum: 23 }
        minute: { type: integer, minimum: 0, maximum: 59 }
        frequency: { type: integer, minimum: 1 }

    PatientReminderSettingsInput:
      type: object
      description: "Partial update — the mobile app sends only the reminder (water or weight) that changed."
      properties:
        water:
          $ref: "#/components/schemas/ReminderSettingInput"
        weight:
          $ref: "#/components/schemas/ReminderSettingInput"

    CareTeamMember:
      type: object
      required: [id, userId, name, specialty]
      properties:
        id: { type: integer, description: "Doctor id" }
        userId: { type: integer }
        name: { type: string }
        avatarUrl: { type: ["string", "null"] }
        specialty: { type: string }
        consultationPrice: { type: ["string", "null"], description: "Private consultation price" }
        acceptsInsurance: { type: boolean, description: "Whether this professional accepts insurance plans" }
        insurances:
          type: array
          items:
            $ref: "#/components/schemas/DoctorInsurance"

    NutritionGoals:
      type: object
      required: [patientId]
      properties:
        patientId: { type: integer }
        dailyCalorieGoal: { type: ["integer", "null"], description: "Daily calorie target (kcal)" }
        dailyWaterGoalMl: { type: "integer", description: "Daily water intake target (ml)" }
        dailyExerciseCalorieGoal: { type: "integer", description: "Daily exercise calorie burn target (kcal)" }
        proteinGoalG: { type: ["integer", "null"], description: "Daily protein target (g)" }
        carbGoalG: { type: ["integer", "null"], description: "Daily carbohydrate target (g)" }
        fatGoalG: { type: ["integer", "null"], description: "Daily fat target (g)" }
        mealsPerDay: { type: ["integer", "null"], description: "Recommended number of meals per day" }
        dietaryRestrictions: { type: ["string", "null"], description: "Free-text dietary restrictions" }
        nutritionNotes: { type: ["string", "null"], description: "General nutritional notes from the health professional" }

    NutritionGoalsInput:
      type: object
      properties:
        dailyCalorieGoal: { type: ["integer", "null"], minimum: 0, description: "Daily calorie target (kcal). Patients may set this themselves, but the value defined by an endocrinologist during a consultation is strongly recommended." }
        dailyWaterGoalMl: { type: integer, minimum: 1, description: "Daily water intake target (ml). Patients may set this themselves, but aligning it with their health professional is recommended." }
        dailyExerciseCalorieGoal: { type: integer, minimum: 1, description: "Daily exercise calorie burn target (kcal). Patients may set this themselves, but aligning it with their health professional is recommended." }
        proteinGoalG: { type: ["integer", "null"], minimum: 0 }
        carbGoalG: { type: ["integer", "null"], minimum: 0 }
        fatGoalG: { type: ["integer", "null"], minimum: 0 }
        mealsPerDay: { type: ["integer", "null"], minimum: 1, maximum: 10 }
        dietaryRestrictions: { type: ["string", "null"] }
        nutritionNotes: { type: ["string", "null"] }

    GoalStatus:
      type: string
      enum: [active, completed, archived]

    Goal:
      type: object
      required: [id, patientId, createdByDoctorId, clinicId, title, status, createdAt, canEdit]
      properties:
        id: { type: integer }
        patientId: { type: integer }
        createdByDoctorId: { type: integer }
        createdByName: { type: string, description: "Name of the health professional who created this goal" }
        clinicId: { type: integer }
        title: { type: string }
        description: { type: ["string", "null"] }
        targetValue: { type: ["number", "null"], description: "Optional numeric target (e.g. 60 for a weight goal, 10000 for a step goal)" }
        unit: { type: ["string", "null"], description: "Free-text unit for targetValue (e.g. kg, passos, ml)" }
        dueDate: { type: ["string", "null"], format: date }
        status:
          $ref: "#/components/schemas/GoalStatus"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        canEdit: { type: boolean, description: "True when the caller is the goal's creator or the clinic owner" }
        latestProgress:
          description: "Most recent progress entry for this goal, if any"
          oneOf:
            - $ref: "#/components/schemas/GoalProgress"
            - type: "null"

    UnreadGoalCount:
      type: object
      required: [count]
      properties:
        count:
          type: integer
          description: Number of goals created or updated since the patient last viewed the goals screen

    GoalInput:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: ["string", "null"] }
        targetValue: { type: ["number", "null"] }
        unit: { type: ["string", "null"] }
        dueDate: { type: ["string", "null"], format: date }

    GoalUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        description: { type: ["string", "null"] }
        targetValue: { type: ["number", "null"] }
        unit: { type: ["string", "null"] }
        dueDate: { type: ["string", "null"], format: date }
        status:
          $ref: "#/components/schemas/GoalStatus"

    GoalProgress:
      type: object
      required: [id, goalId, date, done, createdAt]
      properties:
        id: { type: integer }
        goalId: { type: integer }
        date: { type: string, format: date }
        value: { type: ["number", "null"] }
        done: { type: boolean }
        note: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    GoalProgressInput:
      type: object
      properties:
        date: { type: string, format: date, description: "Defaults to today if omitted" }
        value: { type: ["number", "null"] }
        done: { type: boolean, default: true }
        note: { type: ["string", "null"] }

    PatientInput:
      type: object
      required: [name, email, phone, dateOfBirth, startWeight, targetWeight, cpf, rg, addressStreet, addressNumber, addressNeighborhood, addressCity, addressState, addressZip]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, format: email }
        phone: { type: string, minLength: 8, description: "Telefone do paciente" }
        dateOfBirth: { type: string, format: date }
        startWeight: { type: number, exclusiveMinimum: 0 }
        targetWeight: { type: number, exclusiveMinimum: 0 }
        avatarUrl: { type: string }
        additionalDoctorIds:
          type: array
          items: { type: integer }
          description: Optional professionals (in addition to the creator) to assign to this patient right away
        paymentType:
          $ref: "#/components/schemas/PaymentType"
        insuranceName: { type: ["string", "null"], description: "Free-text convênio (health insurance) name, only meaningful when paymentType is convenio" }
        cpf: { type: string, minLength: 11, description: "CPF do paciente" }
        rg: { type: string, minLength: 1, description: "RG do paciente" }
        addressStreet: { type: string, minLength: 1, description: "Logradouro" }
        addressNumber: { type: string, minLength: 1, description: "Número" }
        addressComplement: { type: string, description: "Complemento" }
        addressNeighborhood: { type: string, minLength: 1, description: "Bairro" }
        addressCity: { type: string, minLength: 1, description: "Cidade" }
        addressState: { type: string, minLength: 2, maxLength: 2, description: "Estado (UF)" }
        addressZip: { type: string, minLength: 8, description: "CEP" }

    PatientUpdate:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email }
        dateOfBirth: { type: string, format: date }
        targetWeight: { type: number }
        avatarUrl: { type: string }
        allergies: { type: ["string", "null"] }
        hasAllergies: { type: boolean }
        medicalConditions: { type: ["string", "null"] }
        dietaryRestrictions: { type: ["string", "null"] }
        hasDietaryRestrictions: { type: boolean }
        psychologyNotes: { type: ["string", "null"] }
        physicalActivityNotes: { type: ["string", "null"] }
        endocrinologyNotes: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        cpf: { type: ["string", "null"], description: "CPF do paciente" }
        rg: { type: ["string", "null"], description: "RG do paciente" }
        addressStreet: { type: ["string", "null"], description: "Logradouro" }
        addressNumber: { type: ["string", "null"], description: "Número" }
        addressComplement: { type: ["string", "null"], description: "Complemento" }
        addressNeighborhood: { type: ["string", "null"], description: "Bairro" }
        addressCity: { type: ["string", "null"], description: "Cidade" }
        addressState: { type: ["string", "null"], description: "Estado (UF)" }
        addressZip: { type: ["string", "null"], description: "CEP" }
        paymentType:
          $ref: "#/components/schemas/PaymentType"
        insuranceName: { type: ["string", "null"], description: "Free-text convênio (health insurance) name, only meaningful when paymentType is convenio" }

    PatientTreatmentDoctor:
      type: object
      required: [doctorId, doctorName, specialty]
      properties:
        doctorId: { type: integer }
        doctorName: { type: string }
        specialty: { type: string }

    PatientTreatmentItem:
      type: object
      required: [enrollmentId, packageId, packageName, status, startDate, endDate, doctors]
      properties:
        enrollmentId: { type: integer }
        packageId: { type: integer }
        packageName: { type: string }
        packageDescription: { type: ["string", "null"] }
        status: { type: string, enum: [active] }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        doctors:
          type: array
          items:
            $ref: "#/components/schemas/PatientTreatmentDoctor"

    PatientTreatmentClinic:
      type: object
      required: [clinicId, clinicName, treatments]
      properties:
        clinicId: { type: integer }
        clinicName: { type: string }
        clinicLogoUrl: { type: ["string", "null"] }
        treatments:
          type: array
          items:
            $ref: "#/components/schemas/PatientTreatmentItem"

    PatientTreatmentsResponse:
      type: object
      required: [patientId, patientName, clinics]
      properties:
        patientId: { type: integer }
        patientName: { type: string }
        clinics:
          type: array
          items:
            $ref: "#/components/schemas/PatientTreatmentClinic"

    PaymentType:
      type: string
      enum: [particular, convenio]
      description: "Whether the patient/lead is private-pay (particular) or uses a health insurance plan (convenio)"

    WeightGoalInput:
      type: object
      required: [targetWeight]
      properties:
        targetWeight: { type: number, minimum: 20, maximum: 500, description: "Weight goal proposed by the patient (kg)" }

    WeightGoalValidation:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [approve, reject]

    AccessToken:
      type: object
      required: [accessToken]
      properties:
        accessToken: { type: string, description: "Long-lived token the patient pastes into the mobile app" }

    UpcomingBirthday:
      type: object
      required: [id, name, dateOfBirth, ageTheyWillTurn, daysUntilBirthday]
      properties:
        id: { type: integer }
        name: { type: string }
        dateOfBirth: { type: string, format: date }
        ageTheyWillTurn: { type: integer, description: "Age the patient will complete on their next birthday" }
        daysUntilBirthday: { type: integer, description: "Number of days until the birthday (0 = today)" }

    PatientSummary:
      type: object
      required: [patientId, totalXp, currentStreak, weeklyGoalRate, checkInCount, weightLostKg]
      properties:
        patientId: { type: integer }
        totalXp: { type: integer }
        currentStreak: { type: integer, description: "Consecutive days with full check-in" }
        weeklyGoalRate:
          type: number
          description: "Percentage of weeks all 3 daily goals completed (0-100)"
        checkInCount: { type: integer }
        weightLostKg: { type: number, description: "Difference from start weight to current" }
        startWeight: { type: ["number", "null"] }
        currentWeight: { type: ["number", "null"] }
        targetWeight: { type: ["number", "null"] }
        lastCheckInDate: { type: ["string", "null"], format: date }

    # ── Doctor ────────────────────────────────────────────────────────────────

    Doctor:
      type: object
      required: [id, userId, name, email, specialty, createdAt]
      properties:
        id: { type: integer }
        userId: { type: integer }
        name: { type: string }
        email: { type: string }
        avatarUrl: { type: ["string", "null"] }
        specialty:
          type: string
          minLength: 1
          maxLength: 100
        bio: { type: ["string", "null"] }
        showOnPublicPage: { type: boolean, default: false, description: "Whether this doctor appears in the clinic's public promo page team section" }
        patientCount: { type: integer, default: 0 }
        avgRating: { type: ["number", "null"], description: "Average rating (1-5) from completed appointment reviews, or null if none yet" }
        reviewCount: { type: integer, default: 0 }
        consultationPrice: { type: ["number", "null"], description: "Preço da consulta particular" }
        acceptsInsurance: { type: boolean, default: false }
        commissionPercent: { type: ["number", "null"], description: "Percentual de comissão sobre a receita das consultas, definido pelo dono da clínica" }
        insurances:
          type: array
          items:
            $ref: "#/components/schemas/DoctorInsurance"
        phone: { type: ["string", "null"], description: "Telefone do profissional" }
        cpf: { type: ["string", "null"], description: "CPF do profissional" }
        rg: { type: ["string", "null"], description: "RG do profissional" }
        birthDate: { type: ["string", "null"], format: date, description: "Data de nascimento" }
        salary: { type: ["number", "null"], description: "Salário (R$), visível apenas para clinic_owner" }
        createdAt: { type: string, format: date-time }
        temporaryPassword: { type: string }

    DoctorInsurance:
      type: object
      required: [id, name, price]
      properties:
        id: { type: integer }
        name: { type: string }
        price: { type: number }

    DoctorInsuranceInput:
      type: object
      required: [name, price]
      properties:
        name: { type: string, minLength: 1 }
        price: { type: number, minimum: 0 }

    DoctorInput:
      type: object
      required: [name, email, specialty]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, format: email }
        specialty:
          type: string
          minLength: 1
          maxLength: 100
        bio: { type: string }
        avatarUrl: { type: ["string", "null"] }
        consultationPrice: { type: number, minimum: 0 }
        acceptsInsurance: { type: boolean }
        commissionPercent: { type: number, minimum: 0, maximum: 100, description: "clinic_owner only" }
        insurances:
          type: array
          items:
            $ref: "#/components/schemas/DoctorInsuranceInput"
        showOnPublicPage: { type: boolean }
        phone: { type: string, description: "Telefone do profissional" }
        cpf: { type: string, description: "CPF do profissional" }
        rg: { type: string, description: "RG do profissional" }
        birthDate: { type: string, format: date, description: "Data de nascimento" }
        salary: { type: number, minimum: 0, description: "Salário (R$), clinic_owner only" }

    DoctorUpdate:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email }
        specialty:
          type: string
          minLength: 1
          maxLength: 100
        bio: { type: string }
        avatarUrl: { type: ["string", "null"] }
        consultationPrice: { type: ["number", "null"], minimum: 0 }
        acceptsInsurance: { type: boolean }
        commissionPercent: { type: ["number", "null"], minimum: 0, maximum: 100, description: "clinic_owner only" }
        insurances:
          type: array
          items:
            $ref: "#/components/schemas/DoctorInsuranceInput"
        showOnPublicPage: { type: boolean }
        phone: { type: ["string", "null"], description: "Telefone do profissional" }
        cpf: { type: ["string", "null"], description: "CPF do profissional" }
        rg: { type: ["string", "null"], description: "RG do profissional" }
        birthDate: { type: ["string", "null"], format: date, description: "Data de nascimento" }
        salary: { type: ["number", "null"], minimum: 0, description: "Salário (R$), clinic_owner only" }

    Secretary:
      type: object
      required: [id, userId, name, email, createdAt, status]
      properties:
        id: { type: integer }
        userId: { type: integer }
        name: { type: string }
        email: { type: string }
        avatarUrl: { type: ["string", "null"] }
        phone: { type: ["string", "null"], description: "Telefone da secretária" }
        cpf: { type: ["string", "null"], description: "CPF da secretária" }
        rg: { type: ["string", "null"], description: "RG da secretária" }
        birthDate: { type: ["string", "null"], format: date, description: "Data de nascimento" }
        salary: { type: ["number", "null"], description: "Salário (R$)" }
        createdAt: { type: string, format: date-time }
        temporaryPassword: { type: string }
        status:
          type: string
          enum: [active, inactive]

    SecretaryInput:
      type: object
      required: [name, email]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, format: email }
        avatarUrl: { type: string }
        phone: { type: string, description: "Telefone da secretária" }
        cpf: { type: string, description: "CPF da secretária" }
        rg: { type: string, description: "RG da secretária" }
        birthDate: { type: string, format: date, description: "Data de nascimento" }
        salary: { type: number, minimum: 0, description: "Salário (R$)" }

    UpdateSecretaryInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, format: email }
        avatarUrl: { type: string }
        password: { type: string, minLength: 6 }
        status:
          type: string
          enum: [active, inactive]
        phone: { type: ["string", "null"], description: "Telefone da secretária" }
        cpf: { type: ["string", "null"], description: "CPF da secretária" }
        rg: { type: ["string", "null"], description: "RG da secretária" }
        birthDate: { type: ["string", "null"], format: date, description: "Data de nascimento" }
        salary: { type: ["number", "null"], minimum: 0, description: "Salário (R$)" }

    DoctorAssignment:
      type: object
      required: [patientId, doctorId, createdAt]
      properties:
        patientId: { type: integer }
        doctorId: { type: integer }
        createdAt: { type: string, format: date-time }

    DoctorAssignmentInput:
      type: object
      required: [doctorId]
      properties:
        doctorId: { type: integer }

    ReassignPatientsInput:
      type: object
      required: [targetDoctorId]
      properties:
        targetDoctorId: { type: integer }

    # ── Agenda / Appointments ────────────────────────────────────────────────

    AvailabilityWindow:
      type: object
      required: [id, doctorId, dayOfWeek, startTime, endTime, slotDurationMinutes]
      properties:
        id: { type: integer }
        doctorId: { type: integer }
        dayOfWeek:
          type: string
          enum: [sunday, monday, tuesday, wednesday, thursday, friday, saturday]
        startTime: { type: string, description: "HH:MM (24h)" }
        endTime: { type: string, description: "HH:MM (24h)" }
        slotDurationMinutes: { type: integer }

    AvailabilityWindowInput:
      type: object
      required: [dayOfWeek, startTime, endTime]
      properties:
        dayOfWeek:
          type: string
          enum: [sunday, monday, tuesday, wednesday, thursday, friday, saturday]
        startTime: { type: string, description: "HH:MM (24h)" }
        endTime: { type: string, description: "HH:MM (24h)" }
        slotDurationMinutes: { type: integer, default: 30 }

    LunchBreak:
      type: object
      required: [dayOfWeek, startTime, endTime]
      properties:
        dayOfWeek:
          type: string
          enum: [sunday, monday, tuesday, wednesday, thursday, friday, saturday]
        startTime: { type: string, description: "HH:MM (24h), interval duration is one hour" }
        endTime: { type: string, description: "HH:MM (24h), exactly one hour after startTime" }

    AvailabilitySettings:
      type: object
      required: [windows, lunchBreaks]
      properties:
        windows:
          type: array
          items:
            $ref: "#/components/schemas/AvailabilityWindow"
        lunchBreaks:
          type: array
          items:
            $ref: "#/components/schemas/LunchBreak"

    SetAvailabilityInput:
      type: object
      required: [windows, lunchBreaks]
      properties:
        windows:
          type: array
          items:
            $ref: "#/components/schemas/AvailabilityWindowInput"
        lunchBreaks:
          type: array
          items:
            $ref: "#/components/schemas/LunchBreak"

    Slot:
      type: object
      required: [startTime, endTime, available]
      properties:
        startTime: { type: string, description: "HH:MM (24h)" }
        endTime: { type: string, description: "HH:MM (24h)" }
        available: { type: boolean }

    Appointment:
      type: object
      required: [id, patientId, patientName, doctorId, doctorName, clinicId, date, startTime, endTime, status, confirmationStatus, modality, createdAt, isPaid]
      properties:
        id: { type: integer }
        patientId: { type: integer }
        patientName: { type: string }
        doctorId: { type: integer }
        doctorName: { type: string }
        clinicId: { type: integer }
        date: { type: string, format: date }
        startTime: { type: string, description: "HH:MM (24h)" }
        endTime: { type: string, description: "HH:MM (24h)" }
        status:
          type: string
          enum: [scheduled, cancelled, completed]
        confirmationStatus:
          type: ["string", "null"]
          enum: [pending, confirmed, null]
          description: "Whether the patient has confirmed the appointment after the reminder email."
        modality:
          type: string
          enum: [presencial, teleconsulta]
          default: presencial
        meetingLink:
          type: ["string", "null"]
          description: "External meeting URL (e.g. Google Meet/Zoom). Only meaningful when modality is teleconsulta."
        cancelReason: { type: ["string", "null"] }
        priceType:
          oneOf:
            - $ref: "#/components/schemas/PaymentType"
            - type: "null"
          description: "Which price applies to this appointment: particular (private) or convenio (insurance). Read-only informational field, not wired to billing yet."
        doctorInsuranceId:
          type: ["integer", "null"]
          description: "When priceType is convenio, the specific insurance plan (of the assigned doctor) that applies."
        insuranceName: { type: ["string", "null"], description: "Insurance name, from a registered plan or free-text entry." }
        priceAmount: { type: ["number", "null"], description: "Resolved price for display: the doctor's consultationPrice when priceType is particular, or the insurance plan's price when convenio." }
        amountCharged: { type: ["number", "null"], description: "Valor cobrado pela consulta, para fins financeiros" }
        createdAt: { type: string, format: date-time }
        review:
          oneOf:
            - $ref: "#/components/schemas/AppointmentReview"
            - type: "null"
        isPaid: { type: boolean, description: "Whether the appointment payment has been recorded as paid" }
        paymentMethod:
          oneOf:
            - $ref: "#/components/schemas/AppointmentPaymentMethod"
            - type: "null"
        paidBy: { type: ["string", "null"], description: "Free-text name of whoever paid (may differ from the patient)" }
        paymentNotes: { type: ["string", "null"] }
        paymentProofUrl: { type: ["string", "null"], description: "Object storage path to an uploaded proof-of-payment photo" }
        paymentRecordedAt: { type: ["string", "null"], format: date-time }
        paymentRecordedByUserId: { type: ["integer", "null"] }

    AppointmentPaymentMethod:
      type: string
      enum: [dinheiro, cartao, pix, convenio, outro]

    CreateAppointmentInput:
      type: object
      required: [doctorId, date, startTime]
      properties:
        doctorId: { type: integer }
        date: { type: string, format: date }
        startTime: { type: string, description: "HH:MM (24h)" }
        patientId:
          type: integer
          description: >-
            Required when a secretaria or clinic_owner books on behalf of a patient.
            Ignored (the caller's own patient record is always used) when the
            caller role is patient.
        modality:
          type: string
          enum: [presencial, teleconsulta]
          description: Defaults to presencial when omitted.
        meetingLink:
          type: string
          description: "Only accepted when modality is teleconsulta."
        priceType:
          $ref: "#/components/schemas/PaymentType"
        doctorInsuranceId:
          type: integer
          description: "Optional registered insurance plan; must belong to the selected doctorId."
        insuranceName:
          type: string
          maxLength: 255
          description: "Free-text insurance name when no registered plan is selected."

    UpdateAppointmentInput:
      type: object
      description: >-
        All fields optional; only provided fields are changed. Changing doctorId,
        date, and/or startTime re-runs the same availability/conflict checks used
        when creating an appointment. Payment fields (isPaid, paymentMethod, paidBy,
        paymentNotes, paymentProofUrl) may only be set by secretaria, clinic_owner,
        or the professional assigned to the appointment.
      properties:
        doctorId: { type: integer }
        date: { type: string, format: date }
        startTime: { type: string, description: "HH:MM (24h)" }
        status:
          type: string
          enum: [scheduled, cancelled, completed]
        isPaid: { type: boolean }
        paymentMethod:
          oneOf:
            - $ref: "#/components/schemas/AppointmentPaymentMethod"
            - type: "null"
        paidBy: { type: ["string", "null"] }
        paymentNotes: { type: ["string", "null"] }
        paymentProofUrl: { type: ["string", "null"] }
        modality:
          type: string
          enum: [presencial, teleconsulta]
        meetingLink:
          type: ["string", "null"]
          description: "Only accepted when modality is (or is being set to) teleconsulta. Pass null to clear."
        priceType:
          $ref: "#/components/schemas/PaymentType"
        doctorInsuranceId:
          type: integer
          description: "Optional registered insurance plan; must belong to the assigned doctor. Pass null (via priceType particular) to clear."
        insuranceName:
          type: string
          maxLength: 255
          description: "Free-text insurance name when no registered plan is selected."
        amountCharged: { type: ["number", "null"], description: "Valor cobrado pela consulta (staff apenas)" }

    # ── Reviews ───────────────────────────────────────────────────────────────

    AppointmentReview:
      type: object
      required: [id, appointmentId, patientId, doctorId, rating, createdAt]
      properties:
        id: { type: integer }
        appointmentId: { type: integer }
        patientId: { type: integer }
        patientName: { type: string }
        doctorId: { type: integer }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    CreateAppointmentReviewInput:
      type: object
      required: [rating]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string }

    DoctorReviews:
      type: object
      required: [doctorId, avgRating, reviewCount, reviews]
      properties:
        doctorId: { type: integer }
        avgRating: { type: ["number", "null"] }
        reviewCount: { type: integer }
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/AppointmentReview"

    # ── Daily Check-in ────────────────────────────────────────────────────────

    CheckIn:
      type: object
      required: [id, patientId, date, xpEarned, createdAt]
      properties:
        id: { type: integer }
        patientId: { type: integer }
        date: { type: string, format: date }
        didExercise: { type: ["boolean", "null"], description: "Legacy field — derived from exercise_entries" }
        drankWater: { type: ["boolean", "null"], description: "Legacy field — derived from water_entries" }
        ateWell: { type: ["boolean", "null"], description: "Legacy field — derived from calorie_entries" }
        note: { type: ["string", "null"] }
        photoUrl: { type: ["string", "null"] }
        foodPhotoUrl: { type: ["string", "null"] }
        exercisePhotoUrl: { type: ["string", "null"] }
        foodCalorieEstimate: { type: ["integer", "null"], description: "AI-estimated calories for the meal" }
        exerciseDescription: { type: ["string", "null"], description: "Description of physical activity performed" }
        exerciseCalorieEstimate: { type: ["integer", "null"], description: "AI-estimated calories burned during activity" }
        xpEarned: { type: integer, default: 0 }
        createdAt: { type: string, format: date-time }

    CheckInInput:
      type: object
      required: [date]
      properties:
        date: { type: string, format: date }
        note: { type: string }
        photoUrl: { type: string }
    CheckInUpdate:
      type: object
      properties:
        note: { type: string }
        photoUrl: { type: string }
    # ── Weekly Weight Entry ───────────────────────────────────────────────────

    WeightEntry:
      type: object
      required: [id, patientId, date, weightKg, createdAt]
      properties:
        id: { type: integer }
        patientId: { type: integer }
        date: { type: string, format: date }
        weightKg: { type: number }
        note: { type: ["string", "null"] }
        photoUrl: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    WeightEntryInput:
      type: object
      required: [date, weightKg]
      properties:
        date: { type: string, format: date }
        weightKg: { type: number, minimum: 20, maximum: 500 }
        note: { type: string }
        photoUrl: { type: string }

    WeightEntryUpdate:
      type: object
      properties:
        weightKg: { type: number, minimum: 20, maximum: 500 }
        note: { type: string }

    # ── Sabotage Note ─────────────────────────────────────────────────────────

    SabotageNote:
      type: object
      required: [id, patientId, date, reason, createdAt]
      properties:
        id: { type: integer }
        patientId: { type: integer }
        date: { type: string, format: date }
        reason: { type: string }
        whatHappened: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    SabotageNoteInput:
      type: object
      required: [date, reason]
      properties:
        date: { type: string, format: date }
        reason: { type: string, minLength: 1 }
        whatHappened: { type: string }

    # ── CRM: Patient Notes ───────────────────────────────────────────────────

    PatientNote:
      type: object
      required: [id, patientId, authorUserId, authorRole, authorName, text, createdAt, updatedAt]
      properties:
        id: { type: integer }
        patientId: { type: integer }
        authorUserId: { type: integer }
        authorRole:
          type: string
          enum: [patient, profissional_saude, clinic_owner, super_admin, secretaria]
        authorName: { type: string }
        text: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PatientNoteInput:
      type: object
      required: [patientId, text]
      properties:
        patientId: { type: integer }
        text: { type: string, minLength: 1 }

    PatientNoteUpdate:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1 }

    # ── CRM: Leads / Pipeline ────────────────────────────────────────────────

    LeadStatus:
      type: string
      enum: [novo, contatado, agendado, convertido, perdido]

    Lead:
      type: object
      required: [id, clinicId, name, status, authorUserId, authorName, createdAt, updatedAt]
      properties:
        id: { type: integer }
        clinicId: { type: integer }
        name: { type: string }
        contact: { type: ["string", "null"] }
        source: { type: ["string", "null"] }
        status: { $ref: "#/components/schemas/LeadStatus" }
        notes: { type: ["string", "null"] }
        paymentType:
          $ref: "#/components/schemas/PaymentType"
        insuranceName: { type: ["string", "null"], description: "Free-text convênio (health insurance) name, only meaningful when paymentType is convenio" }
        convertedPatientId: { type: ["integer", "null"] }
        authorUserId: { type: integer }
        authorName: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    LeadInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        contact: { type: string }
        source: { type: string }
        status: { $ref: "#/components/schemas/LeadStatus" }
        notes: { type: string }
        paymentType:
          $ref: "#/components/schemas/PaymentType"
        insuranceName: { type: ["string", "null"] }

    LeadUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        contact: { type: string }
        source: { type: string }
        notes: { type: string }
        paymentType:
          $ref: "#/components/schemas/PaymentType"
        insuranceName: { type: ["string", "null"] }
        convertedPatientId: { type: integer }

    LeadStageInput:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/LeadStatus" }
        convertedPatientId: { type: integer }

    # ── Chat / Conversations ──────────────────────────────────────────────────

    ConversationParticipant:
      type: object
      required: [userId, name, avatarUrl, role]
      properties:
        userId: { type: integer }
        name: { type: string }
        avatarUrl: { type: ["string", "null"] }
        role:
          type: string
          enum: [patient, profissional_saude, clinic_owner, secretaria, super_admin]

    Conversation:
      type: object
      required:
        [
          id,
          clinicId,
          patientId,
          doctorId,
          patientName,
          doctorName,
          patientAvatarUrl,
          doctorAvatarUrl,
          participantA,
          participantB,
          otherParticipant,
          unreadCount,
          lastMessageAt,
          createdAt,
        ]
      properties:
        id: { type: integer }
        clinicId: { type: integer }
        patientId:
          type: ["integer", "null"]
          description: "Set when one of the two participants is a patient (back-compat with the mobile app)"
        doctorId:
          type: ["integer", "null"]
          description: "Set when one of the two participants is a health professional (back-compat with the mobile app)"
        patientName: { type: ["string", "null"] }
        doctorName: { type: ["string", "null"] }
        patientAvatarUrl: { type: ["string", "null"] }
        doctorAvatarUrl: { type: ["string", "null"] }
        participantA:
          $ref: "#/components/schemas/ConversationParticipant"
        participantB:
          $ref: "#/components/schemas/ConversationParticipant"
        otherParticipant:
          description: "The other participant relative to the caller (if the caller is a participant; otherwise mirrors participantB)"
          $ref: "#/components/schemas/ConversationParticipant"
        lastMessagePreview: { type: ["string", "null"] }
        unreadCount: { type: integer }
        lastMessageAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    ConversationInput:
      type: object
      properties:
        doctorId:
          type: integer
          description: "Required when the caller is a patient. When the caller is a secretaria, use together with patientId for the legacy patient-doctor conversation path."
        patientId:
          type: integer
          description: "Required when the caller is a health professional. When the caller is a secretaria, use together with doctorId for the legacy patient-doctor conversation path."
        otherUserId:
          type: integer
          description: "users.id of the recipient. Only used by a secretaria to start a conversation with any professional, clinic owner, or patient in her own clinic."

    ConversationRecipient:
      type: object
      required: [userId, name, avatarUrl, role]
      properties:
        userId: { type: integer }
        name: { type: string }
        avatarUrl: { type: ["string", "null"] }
        role:
          type: string
          enum: [profissional_saude, clinic_owner, patient]

    ConversationRecipients:
      type: object
      required: [doctors, owners, patients]
      properties:
        doctors:
          type: array
          items: { $ref: "#/components/schemas/ConversationRecipient" }
        owners:
          type: array
          items: { $ref: "#/components/schemas/ConversationRecipient" }
        patients:
          type: array
          items: { $ref: "#/components/schemas/ConversationRecipient" }

    Message:
      type: object
      required: [id, conversationId, senderId, senderRole, content, attachments, createdAt]
      properties:
        id: { type: integer }
        conversationId: { type: integer }
        senderId: { type: integer }
        senderRole:
          type: string
          enum: [patient, profissional_saude, clinic_owner, secretaria, super_admin]
        content: { type: string }
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/MessageAttachment"
        readAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }

    MessageAttachment:
      type: object
      required: [path, name, contentType, size]
      properties:
        path: { type: string }
        name: { type: string, minLength: 1, maxLength: 255 }
        contentType: { type: string, minLength: 1, maxLength: 255 }
        size: { type: integer, minimum: 1, maximum: 52428800 }

    MessageInput:
      type: object
      properties:
        content: { type: string, maxLength: 4000 }
        attachments:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/MessageAttachment"

    UnreadCount:
      type: object
      required: [count]
      properties:
        count: { type: integer }

    # ── Community feed ────────────────────────────────────────────────────────

    CommunityMediaType:
      type: string
      enum: [photo, video, file]

    CommunityUpload:
      type: object
      required: [mediaUrl, mediaType, mediaName, mediaContentType]
      properties:
        mediaUrl: { type: string }
        mediaType:
          $ref: "#/components/schemas/CommunityMediaType"
        mediaName: { type: string, maxLength: 255 }
        mediaContentType: { type: string, maxLength: 255 }

    CommunityPost:
      type: object
      required:
        [
          id,
          clinicId,
          authorUserId,
          authorName,
          authorRole,
          authorAvatarUrl,
          content,
          mediaUrl,
          mediaType,
          mediaName,
          mediaContentType,
          likeCount,
          likedByMe,
          commentCount,
          createdAt,
        ]
      properties:
        id: { type: integer }
        clinicId: { type: integer }
        authorUserId: { type: integer }
        authorName: { type: string }
        authorRole:
          type: string
          enum: [patient, profissional_saude, clinic_owner, secretaria, super_admin]
        authorAvatarUrl: { type: ["string", "null"] }
        content: { type: ["string", "null"] }
        mediaUrl: { type: ["string", "null"] }
        mediaType:
          allOf: [{ $ref: "#/components/schemas/CommunityMediaType" }]
          nullable: true
        mediaName: { type: ["string", "null"] }
        mediaContentType: { type: ["string", "null"] }
        likeCount: { type: integer }
        likedByMe: { type: boolean }
        commentCount: { type: integer }
        canDelete: { type: boolean, description: "Whether the caller may delete this post (author or moderator)" }
        createdAt: { type: string, format: date-time }

    CommunityPostInput:
      type: object
      properties:
        content: { type: string, minLength: 1, maxLength: 4000 }
        mediaUrl: { type: string }
        mediaType:
          $ref: "#/components/schemas/CommunityMediaType"
        mediaName: { type: string, maxLength: 255 }
        mediaContentType: { type: string, maxLength: 255 }

    CommunityLikeState:
      type: object
      required: [liked, likeCount]
      properties:
        liked: { type: boolean }
        likeCount: { type: integer }

    CommunityComment:
      type: object
      required: [id, postId, authorUserId, authorName, authorRole, authorAvatarUrl, content, mediaUrl, mediaType, mediaName, mediaContentType, createdAt]
      properties:
        id: { type: integer }
        postId: { type: integer }
        authorUserId: { type: integer }
        authorName: { type: string }
        authorRole:
          type: string
          enum: [patient, profissional_saude, clinic_owner, secretaria, super_admin]
        authorAvatarUrl: { type: ["string", "null"] }
        content: { type: string }
        mediaUrl: { type: ["string", "null"] }
        mediaType:
          allOf: [{ $ref: "#/components/schemas/CommunityMediaType" }]
          nullable: true
        mediaName: { type: ["string", "null"] }
        mediaContentType: { type: ["string", "null"] }
        canDelete: { type: boolean, description: "Whether the caller may delete this comment (author or moderator)" }
        createdAt: { type: string, format: date-time }

    CommunityCommentInput:
      type: object
      properties:
        content: { type: string, minLength: 1, maxLength: 2000 }
        mediaUrl: { type: string }
        mediaType:
          $ref: "#/components/schemas/CommunityMediaType"
        mediaName: { type: string, maxLength: 255 }
        mediaContentType: { type: string, maxLength: 255 }

    CommunityNotificationPreferences:
      type: object
      required: [muted]
      properties:
        muted: { type: boolean, description: "When true, realtime SSE updates are suppressed for this user; the feed is still accessible via polling" }

    CommunityNotificationPreferencesInput:
      type: object
      required: [muted]
      properties:
        muted: { type: boolean }

    CommunityReportInput:
      type: object
      properties:
        reason: { type: string, maxLength: 500 }

    CommunityReportItem:
      type: object
      required: [id, clinicId, reporterUserId, reporterName, targetType, targetId, status, targetExists, targetAuthorName, createdAt]
      properties:
        id: { type: integer }
        clinicId: { type: integer }
        reporterUserId: { type: integer }
        reporterName: { type: string }
        targetType:
          type: string
          enum: [post, comment]
        targetId: { type: integer }
        reason: { type: ["string", "null"] }
        status:
          type: string
          enum: [open, dismissed]
        targetExists: { type: boolean, description: "Whether the reported content still exists (false means it was already deleted)" }
        targetContent: { type: ["string", "null"] }
        targetMediaUrl: { type: ["string", "null"] }
        targetMediaType: { type: ["string", "null"] }
        targetAuthorName: { type: string }
        createdAt: { type: string, format: date-time }

    # ── XP / Gamification ─────────────────────────────────────────────────────

    TodayGoals:
      type: object
      required: [water, exercise, nutrition]
      properties:
        water: { type: boolean }
        exercise: { type: boolean }
        nutrition: { type: boolean }

    XpSummary:
      type: object
      required: [patientId, totalXp, level, weeklyXp, monthlyXp]
      properties:
        patientId: { type: integer }
        totalXp: { type: integer }
        level: { type: integer }
        weeklyXp: { type: integer }
        monthlyXp: { type: integer }
        currentWeekGoalsCompleted: { type: integer, description: "0-7 days this week with all 3 goals" }
        currentMonthPerfect: { type: boolean }
        currentStreak: { type: integer, description: "Number of consecutive days with all 3 goals completed" }
        todayGoals:
          $ref: "#/components/schemas/TodayGoals"

    XpEntry:
      type: object
      required: [id, patientId, points, reason, createdAt]
      properties:
        id: { type: integer }
        patientId: { type: integer }
        points: { type: integer }
        reason:
          type: string
          enum: [exercise, water, nutrition, weekly_bonus, monthly_bonus]
        date: { type: string, format: date }
        createdAt: { type: string, format: date-time }

    XpHeatmapDay:
      type: object
      required: [date, level]
      properties:
        date:
          type: string
          format: date
          description: "ISO date string YYYY-MM-DD"
        level:
          type: integer
          enum: [0, 1, 2]
          description: "0 = no goals, 1 = 1–2 goals completed, 2 = all 3 goals completed"

    # ── Clinic Dashboard ──────────────────────────────────────────────────────

    ClinicBranding:
      type: object
      required: [clinicName, updatedAt, version]
      properties:
        clinicName: { type: string, description: "Display name of the clinic" }
        logoUrl: { type: ["string", "null"], description: "URL of the clinic logo stored in object storage" }
        senderName: { type: ["string", "null"], description: "Custom name shown in the From field of invite emails (defaults to clinicName)" }
        fromEmail: { type: ["string", "null"], description: "From email address for invite emails; must use a Resend-verified domain (e.g. noreply@suaclinica.com.br)" }
        replyToEmail: { type: ["string", "null"], description: "Reply-to address for invite emails; must use a Resend-verified domain" }
        privacyPolicyUrl: { type: ["string", "null"], description: "Custom URL for the clinic's Privacy Policy page (shown in the Sobre screen)" }
        termsUrl: { type: ["string", "null"], description: "Custom URL for the clinic's Terms of Use page (shown in the Sobre screen)" }
        copyrightUrl: { type: ["string", "null"], description: "Custom URL for the clinic's Copyright/IP page (shown in the Sobre screen)" }
        contactUrl: { type: ["string", "null"], description: "Custom URL for the clinic's Contact page (shown in the Sobre screen)" }
        deletionRequestUrl: { type: ["string", "null"], description: "Custom URL for the clinic's data deletion request page (shown in the Sobre screen; if absent the built-in flow is used)" }
        updatedAt: { type: string, format: date-time, description: "ISO timestamp of the last branding update — mobile clients use this as a cache-busting version token" }
        version: { type: integer, description: "Monotonically increasing counter bumped on every branding PATCH — mobile clients force-expire their local cache whenever this value changes" }

    UpdateClinicBrandingInput:
      type: object
      properties:
        clinicName: { type: string }
        logoUrl:
          type: ["string", "null"]
          pattern: "^/objects/"
          description: "Must be a valid object-storage path starting with /objects/"
        senderName:
          type: ["string", "null"]
          description: "Custom sender name shown in invite emails"
        fromEmail:
          type: ["string", "null"]
          format: email
          description: "From email address for invite emails; must use a Resend-verified domain"
        replyToEmail:
          type: ["string", "null"]
          format: email
          description: "Reply-to email for invite emails; must use a Resend-verified domain"
        privacyPolicyUrl:
          type: ["string", "null"]
          format: uri
          description: "Custom URL for the clinic's Privacy Policy page"
        termsUrl:
          type: ["string", "null"]
          format: uri
          description: "Custom URL for the clinic's Terms of Use page"
        copyrightUrl:
          type: ["string", "null"]
          format: uri
          description: "Custom URL for the clinic's Copyright/IP page"
        contactUrl:
          type: ["string", "null"]
          format: uri
          description: "Custom URL for the clinic's Contact page"
        deletionRequestUrl:
          type: ["string", "null"]
          format: uri
          description: "Custom URL for the clinic's data deletion request page"

    ClinicPublicService:
      type: object
      required: [id, title, order]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: ["string", "null"] }
        order: { type: integer }

    ClinicPublicServiceInput:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: ["string", "null"] }

    ReorderClinicPublicServicesInput:
      type: object
      required: [serviceIds]
      properties:
        serviceIds:
          type: array
          items: { type: integer }
          description: "All service IDs for the clinic, in the desired display order"

    ClinicPublicPageLink:
      type: object
      required: [slug, published]
      properties:
        slug: { type: ["string", "null"] }
        published: { type: boolean }

    ClinicPublicPage:
      type: object
      required: [slug, published, updatedAt]
      properties:
        slug: { type: string, description: "URL-safe unique identifier used at /p/:slug" }
        published: { type: boolean, default: false }
        tagline: { type: ["string", "null"], description: "Short slogan / tagline shown below the clinic name in the hero" }
        about: { type: ["string", "null"], description: "Free-text about/mission section" }
        coverImageUrl: { type: ["string", "null"], description: "Object storage path for the hero cover image" }
        address: { type: ["string", "null"] }
        phone: { type: ["string", "null"], description: "Phone/WhatsApp number" }
        contactEmail: { type: ["string", "null"] }
        socialLinks:
          type: ["object", "null"]
          additionalProperties: { type: string }
          description: "Map of platform name (instagram, facebook, whatsapp, website) to URL"
        businessHours:
          type: ["object", "null"]
          additionalProperties: { type: string }
          description: "Map of weekday label to hours string, e.g. { \"Seg a Sex\": \"08:00–18:00\" }"
        updatedAt: { type: string, format: date-time }

    UpdateClinicPublicPageInput:
      type: object
      properties:
        slug:
          type: string
          minLength: 3
          pattern: "^[a-z0-9-]+$"
          description: "URL-safe slug, lowercase letters/numbers/hyphens only"
        published: { type: boolean }
        tagline: { type: ["string", "null"] }
        about: { type: ["string", "null"] }
        coverImageUrl:
          type: ["string", "null"]
          pattern: "^/objects/"
        address: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        contactEmail:
          type: ["string", "null"]
          format: email
        socialLinks:
          type: ["object", "null"]
          additionalProperties: { type: string }
        businessHours:
          type: ["object", "null"]
          additionalProperties: { type: string }

    PublicClinicTeamMember:
      type: object
      required: [id, name, specialty]
      properties:
        id: { type: integer }
        name: { type: string }
        avatarUrl: { type: ["string", "null"] }
        specialty:
          type: string
          minLength: 1
          maxLength: 100
        bio: { type: ["string", "null"] }
        showOnPublicPage: { type: boolean }

    UpdatePublicTeamMemberInput:
      type: object
      properties:
        bio: { type: ["string", "null"] }
        avatarUrl:
          type: ["string", "null"]
          description: "Object storage path (or null to clear)"
        showOnPublicPage: { type: boolean }

    ClinicGalleryPhoto:
      type: object
      required: [id, url, order]
      properties:
        id: { type: integer }
        url: { type: string, description: "Object storage path for the photo" }
        caption: { type: ["string", "null"] }
        order: { type: integer }

    AddClinicGalleryPhotoInput:
      type: object
      required: [url]
      properties:
        url:
          type: string
          pattern: "^/objects/"
          description: "Object storage path returned by the upload endpoint"
        caption: { type: ["string", "null"] }

    UpdateClinicGalleryPhotoInput:
      type: object
      properties:
        caption: { type: ["string", "null"] }

    ReorderClinicGalleryPhotosInput:
      type: object
      required: [photoIds]
      properties:
        photoIds:
          type: array
          items: { type: integer }
          description: "All photo IDs for the clinic gallery, in the desired display order"

    PublicClinicPage:
      type: object
      required: [clinicName, slug]
      properties:
        clinicName: { type: string }
        logoUrl: { type: ["string", "null"] }
        primaryColor: { type: ["string", "null"] }
        slug: { type: string }
        tagline: { type: ["string", "null"] }
        about: { type: ["string", "null"] }
        coverImageUrl: { type: ["string", "null"] }
        address: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        contactEmail: { type: ["string", "null"] }
        socialLinks:
          type: ["object", "null"]
          additionalProperties: { type: string }
        businessHours:
          type: ["object", "null"]
          additionalProperties: { type: string }
        services:
          type: array
          items: { $ref: "#/components/schemas/ClinicPublicService" }
        team:
          type: array
          items: { $ref: "#/components/schemas/PublicClinicTeamMember" }
        gallery:
          type: array
          items: { $ref: "#/components/schemas/ClinicGalleryPhoto" }

    ClinicSettings:
      type: object
      required: [plan, planLabel, planPrice, doctorCount, updatedAt]
      properties:
        plan:
          type: string
          enum: [basic, pro, professional, enterprise]
        planLabel: { type: string }
        planPrice: { type: string }
        doctorLimit: { type: ["integer", "null"], description: "Max doctors allowed; null = unlimited" }
        doctorCount: { type: integer }
        updatedAt: { type: string, format: date-time }

    UpdateClinicSettingsInput:
      type: object
      required: [plan]
      properties:
        plan:
          type: string
          enum: [basic, pro, professional, enterprise]

    ClinicDashboard:
      type: object
      required: [totalPatients, totalDoctors, avgWeightLoss, activeThisWeek, totalXpAwarded]
      properties:
        totalPatients: { type: integer }
        totalDoctors: { type: integer }
        avgWeightLoss: { type: number, description: "Average kg lost across all patients" }
        activeThisWeek: { type: integer, description: "Patients with at least one check-in this week" }
        totalXpAwarded: { type: integer }
        topPatients:
          type: array
          items:
            $ref: "#/components/schemas/PatientLeaderboardItem"
        weightLossByMonth:
          type: array
          items:
            $ref: "#/components/schemas/MonthlyWeightStat"
        doctorWorkload:
          type: array
          description: "Per-doctor patient count for workload distribution"
          items:
            $ref: "#/components/schemas/DoctorWorkloadItem"

    DoctorWorkloadItem:
      type: object
      required: [doctorId, name, patientCount]
      properties:
        doctorId: { type: integer }
        name: { type: string }
        avatarUrl: { type: ["string", "null"] }
        patientCount: { type: integer }

    PatientLeaderboardItem:
      type: object
      required: [patientId, name, totalXp, weightLostKg]
      properties:
        patientId: { type: integer }
        name: { type: string }
        avatarUrl: { type: ["string", "null"] }
        totalXp: { type: integer }
        weightLostKg: { type: number }

    MonthlyWeightStat:
      type: object
      required: [month, avgWeightKg, patientCount]
      properties:
        month: { type: string, description: "YYYY-MM" }
        avgWeightKg: { type: number }
        patientCount: { type: integer }

    ActivityItem:
      type: object
      required: [id, type, patientId, patientName, createdAt]
      properties:
        id: { type: integer }
        type:
          type: string
          enum:
            [
              check_in,
              weight_entry,
              sabotage_note,
              xp_earned,
              staff_onboarding,
              appointment_booked,
              appointment_cancelled,
              appointment_updated,
              patient_note,
              lead_created,
              lead_stage_changed,
              plan_limit_warning,
              plan_limit_reached,
              form_response_submitted,
              access_code_auto_resent,
            ]
        patientId: { type: integer }
        patientName: { type: string }
        avatarUrl: { type: ["string", "null"] }
        description: { type: string }
        createdAt: { type: string, format: date-time }

    # ── Materials ─────────────────────────────────────────────────────────────

    PatientMaterial:
      type: object
      required: [id, patientId, senderId, type, title, createdAt]
      properties:
        id: { type: integer }
        patientId: { type: integer }
        senderId: { type: integer }
        type:
          type: string
          enum: [video, pdf, prescription, meal_plan, other]
        title: { type: string }
        description: { type: ["string", "null"] }
        fileUrl: { type: ["string", "null"] }
        externalUrl: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        senderName: { type: ["string", "null"] }
        senderRole: { type: ["string", "null"] }

    CreateMaterialInput:
      type: object
      required: [type, title]
      properties:
        type:
          type: string
          enum: [video, pdf, prescription, meal_plan, other]
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 1000 }
        fileUrl: { type: string, description: "objectPath from storage upload" }
        externalUrl: { type: string, description: "External URL, e.g. YouTube link" }

    # ── Finance ───────────────────────────────────────────────────────────────

    ExpenseCategory:
      type: string
      enum: [salario, agua, luz, telefone, internet, outro]

    Expense:
      type: object
      required: [id, clinicId, category, description, amount, period, createdByUserId, createdByName, createdAt, updatedAt]
      properties:
        id: { type: integer }
        clinicId: { type: integer }
        category:
          $ref: "#/components/schemas/ExpenseCategory"
        description: { type: string }
        amount: { type: number }
        period: { type: string, description: "YYYY-MM" }
        receiptUrl: { type: ["string", "null"], description: "objectPath from storage upload" }
        createdByUserId: { type: integer }
        createdByName: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ExpenseInput:
      type: object
      required: [category, description, amount, period]
      properties:
        category:
          $ref: "#/components/schemas/ExpenseCategory"
        description: { type: string, minLength: 1, maxLength: 500 }
        amount: { type: number, minimum: 0 }
        period: { type: string, description: "YYYY-MM" }
        receiptUrl: { type: ["string", "null"], description: "objectPath from storage upload" }

    ExpenseUpdateInput:
      type: object
      properties:
        category:
          $ref: "#/components/schemas/ExpenseCategory"
        description: { type: string, minLength: 1, maxLength: 500 }
        amount: { type: number, minimum: 0 }
        period: { type: string, description: "YYYY-MM" }
        receiptUrl: { type: ["string", "null"], description: "objectPath from storage upload" }

    RevenueBreakdownItem:
      type: object
      required: [label, paid, pending, total]
      properties:
        label: { type: string }
        paid: { type: number }
        pending: { type: number }
        total: { type: number }

    RevenueAppointmentItem:
      type: object
      required: [appointmentId, date, patientName, doctorName, amountCharged, isPaid, paymentMethod]
      properties:
        appointmentId: { type: integer }
        date: { type: string, format: date }
        patientName: { type: string }
        doctorName: { type: string }
        amountCharged: { type: ["number", "null"] }
        isPaid: { type: boolean }
        paymentMethod:
          oneOf:
            - $ref: "#/components/schemas/AppointmentPaymentMethod"
            - type: "null"

    FinanceRevenue:
      type: object
      required: [period, totalRevenue, totalPaid, totalPending, byPaymentType, appointmentCount, appointments]
      properties:
        period: { type: string, description: "YYYY-MM" }
        totalRevenue: { type: number }
        totalPaid: { type: number }
        totalPending: { type: number }
        appointmentCount: { type: integer }
        byPaymentType:
          type: array
          description: "Breakdown by particular vs convenio"
          items:
            $ref: "#/components/schemas/RevenueBreakdownItem"
        appointments:
          type: array
          description: "Per-appointment revenue detail for the period (excludes cancelled appointments)"
          items:
            $ref: "#/components/schemas/RevenueAppointmentItem"

    CommissionItem:
      type: object
      required: [doctorId, doctorName, commissionPercent, revenue, commissionAmount]
      properties:
        doctorId: { type: integer }
        doctorName: { type: string }
        commissionPercent: { type: number }
        revenue: { type: number, description: "Total amountCharged across paid appointments for this professional in the period" }
        commissionAmount: { type: number, description: "revenue * commissionPercent / 100" }

    FinanceSummary:
      type: object
      required: [period, totalRevenue, totalExpenses, cashBalance]
      properties:
        period: { type: string, description: "YYYY-MM" }
        totalRevenue: { type: number, description: "Total paid appointment revenue for the period" }
        totalExpenses: { type: number }
        cashBalance: { type: number, description: "totalRevenue - totalExpenses" }

    # ── Storage ───────────────────────────────────────────────────────────────

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, description: "Original file name" }
        size: { type: integer, description: "File size in bytes" }
        contentType: { type: string, description: "MIME type, e.g. image/jpeg" }
        purpose:
          type: string
          enum: [care-package-promotion]

    UploadUrlResponse:
      type: object
      required: [uploadUrl, objectPath]
      properties:
        uploadUrl: { type: string, description: "Presigned URL to PUT the file to" }
        objectPath: { type: string, description: "App-relative path to store and later serve the object" }

    # ── AI Analysis ───────────────────────────────────────────────────────

    PatientSummaryInput:
      type: object
      required: [patientId]
      properties:
        patientId:
          type: integer
          description: ID of the patient to summarize
        startDate:
          type: string
          format: date
          description: "Start of the period (inclusive). Omit for full history."
        endDate:
          type: string
          format: date
          description: "End of the period (inclusive). Omit for full history."
        saveSummary:
          type: boolean
          description: "If true, persist the generated summary in the database."

    AiPatientSummaryResult:
      type: object
      required: [summary]
      properties:
        summary:
          type: string
          description: AI-generated evolution summary text
        savedId:
          type: ["integer", "null"]
          description: "ID of the persisted summary record, if saveSummary was true."

    AiPatientSummaryRecord:
      type: object
      required: [id, patientId, generatedBy, summaryText, createdAt]
      properties:
        id: { type: integer }
        patientId: { type: integer }
        generatedBy: { type: integer }
        startDate:
          type: ["string", "null"]
          format: date
        endDate:
          type: ["string", "null"]
          format: date
        summaryText: { type: string }
        doctorNotes:
          type: ["string", "null"]
        createdAt: { type: string, format: date-time }

    UpdateAiSummaryNotesBody:
      type: object
      required: [doctorNotes]
      properties:
        doctorNotes:
          type: ["string", "null"]
          description: Clinical notes added by the doctor alongside the AI summary

    AnalyzeMealInput:
      type: object
      description: Provide either foodPhotoUrl or mealDescription (at least one is required).
      properties:
        foodPhotoUrl:
          type: string
          description: Object path or URL of the food photo to analyze
        mealDescription:
          type: string
          description: Free-text description of what was eaten, used when no photo is provided
        checkInId:
          type: integer
          description: Optional check-in ID to persist the estimate into

    AnalyzeActivityInput:
      type: object
      required: [exerciseDescription]
      properties:
        exerciseDescription:
          type: string
          description: Description of the physical activity performed
        checkInId:
          type: integer
          description: Optional check-in ID to persist the estimate into (legacy)
        exerciseEntryId:
          type: integer
          description: Optional exercise entry ID to persist the estimate into

    CalorieEstimate:
      type: object
      required: [text]
      properties:
        estimate:
          type: [integer, "null"]
          description: Estimated calorie value (kcal)
        text:
          type: string
          description: Full AI response with explanation
        proteinG:
          type: [integer, "null"]
          description: Estimated protein (g)
        carbG:
          type: [integer, "null"]
          description: Estimated carbohydrates (g)
        fatG:
          type: [integer, "null"]
          description: Estimated fat (g)

    # ── Calorie Entries ───────────────────────────────────────────────────────

    CalorieEntry:
      type: object
      required: [id, patientId, date, calories, createdAt]
      properties:
        id: { type: integer }
        patientId: { type: integer }
        date: { type: string, format: date }
        mealLabel:
          type: ["string", "null"]
          enum: [breakfast, lunch, dinner, snack, other, null]
        photoUrl: { type: ["string", "null"] }
        calories: { type: integer }
        aiDescription: { type: ["string", "null"] }
        proteinG: { type: ["integer", "null"], description: "Protein consumed (g)" }
        carbG: { type: ["integer", "null"], description: "Carbohydrates consumed (g)" }
        fatG: { type: ["integer", "null"], description: "Fat consumed (g)" }
        createdAt: { type: string, format: date-time }

    CreateCalorieEntryInput:
      type: object
      required: [patientId, date, calories]
      properties:
        patientId: { type: integer }
        date: { type: string, format: date }
        mealLabel:
          type: string
          enum: [breakfast, lunch, dinner, snack, other]
        photoUrl: { type: string }
        calories: { type: integer, minimum: 0, maximum: 10000 }
        aiDescription: { type: string }
        proteinG: { type: integer, minimum: 0, description: "Protein (g)" }
        carbG: { type: integer, minimum: 0, description: "Carbohydrates (g)" }
        fatG: { type: integer, minimum: 0, description: "Fat (g)" }

    CalorieDaySummary:
      type: object
      required: [date, total]
      properties:
        date: { type: string, format: date }
        total: { type: integer }

    ResetPasswordInput:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string }
        newPassword: { type: string, minLength: 8 }

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: { type: string }

    # ── Water Entries ─────────────────────────────────────────────────────────

    WaterEntry:
      type: object
      required: [id, patientId, date, amountMl, createdAt]
      properties:
        id: { type: integer }
        patientId: { type: integer }
        date: { type: string, format: date }
        amountMl: { type: integer, description: "Water volume in millilitres" }
        createdAt: { type: string, format: date-time }

    CreateWaterEntryInput:
      type: object
      required: [date, amountMl]
      properties:
        date: { type: string, format: date }
        amountMl: { type: integer, minimum: 1, maximum: 5000, description: "Water volume in millilitres" }

    WaterDaySummary:
      type: object
      required: [date, totalMl]
      properties:
        date: { type: string, format: date }
        totalMl: { type: integer }

    # ── Exercise Entries ──────────────────────────────────────────────────────

    ExerciseEntry:
      type: object
      required: [id, patientId, date, description, createdAt]
      properties:
        id: { type: integer }
        patientId: { type: integer }
        date: { type: string, format: date }
        description: { type: string }
        durationMin: { type: ["integer", "null"], description: "Workout duration in minutes" }
        calorieEstimate: { type: ["integer", "null"], description: "AI-estimated calories burned" }
        photoUrl: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    CreateExerciseEntryInput:
      type: object
      required: [date, description]
      properties:
        date: { type: string, format: date }
        description: { type: string, minLength: 1 }
        durationMin: { type: integer, minimum: 1, maximum: 1440 }
        photoUrl: { type: string }

    # ── Clinics ───────────────────────────────────────────────────────────────

    # ── Admin ─────────────────────────────────────────────────────────────────

    AdminClinic:
      type: object
      required: [id, name, plan, doctorCount, patientCount, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        rawName: { type: string }
        logoUrl: { type: ["string", "null"] }
        primaryColor: { type: ["string", "null"] }
        plan:
          type: string
          enum: [basic, pro, professional, enterprise]
        doctorCount: { type: integer, default: 0 }
        patientCount: { type: integer, default: 0 }
        doctorLimit: { type: ["integer", "null"], description: "Max doctors allowed by plan; null = unlimited" }
        planUsagePct: { type: ["number", "null"], description: "doctorCount / doctorLimit, null when unlimited" }
        isNearPlanLimit: { type: boolean, description: "true when planUsagePct >= 0.9", default: false }
        createdAt: { type: string, format: date-time }

    AdminCreateClinicInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        logoUrl: { type: string }
        primaryColor: { type: string }
        plan:
          type: string
          enum: [basic, pro, professional, enterprise]

    AdminUpdateClinicInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        logoUrl: { type: ["string", "null"] }
        primaryColor: { type: string }
        plan:
          type: string
          enum: [basic, pro, professional, enterprise]

    AdminClinicMember:
      type: object
      required: [userId, clinicId, name, email]
      properties:
        userId: { type: integer }
        clinicId: { type: integer }
        name: { type: string }
        email: { type: string }
        avatarUrl: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    AdminClinicPatient:
      type: object
      required: [patientId, userId, name, email]
      properties:
        patientId: { type: integer }
        userId: { type: integer }
        name: { type: string }
        email: { type: string }
        avatarUrl: { type: ["string", "null"] }
        enrolledAt: { type: string, format: date-time }

    AdminClinicDoctor:
      type: object
      required: [doctorId, userId, name, email, specialty]
      properties:
        doctorId: { type: integer }
        userId: { type: integer }
        name: { type: string }
        email: { type: string }
        avatarUrl: { type: ["string", "null"] }
        specialty: { type: string }
        createdAt: { type: string, format: date-time }

    AdminEnrollByEmailInput:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    PatientClinicInfo:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        logoUrl: { type: ["string", "null"] }
        primaryColor: { type: ["string", "null"] }
        doctorCount: { type: integer, description: "Number of doctors registered in this clinic (clinic_owner view only)" }
        plan:
          type: string
          enum: [basic, pro, professional, enterprise]
          description: "Current plan id (clinic_owner view only)"
        planLabel: { type: string, description: "Human-readable plan name (clinic_owner view only)" }

    CreateClinicInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, description: "Clinic name" }
        primaryColor: { type: string, pattern: "^#[0-9a-fA-F]{6}$", description: "Hex color, e.g. #16a34a" }
        logoUrl: { type: "string", description: "Object storage path for the clinic logo, e.g. /objects/..." }

    UpdateClinicInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        logoUrl: { type: ["string", "null"] }
        primaryColor: { type: ["string", "null"] }

    SelectClinicInput:
      type: object
      required: [clinicId]
      properties:
        clinicId: { type: integer, description: "ID of the clinic to scope the session to" }

    SelectClinicResponse:
      type: object
      required: [token, clinicId, clinic]
      properties:
        token: { type: string, description: "Clinic-scoped JWT with clinicId claim" }
        clinicId: { type: integer }
        clinic:
          type: object
          required: [id, name]
          properties:
            id: { type: integer }
            name: { type: string }
            logoUrl: { type: ["string", "null"] }
            primaryColor: { type: ["string", "null"] }

    ConsentStatusResponse:
      type: object
      required: [hasConsent]
      properties:
        hasConsent: { type: boolean }
        grantedAt: { type: ["string", "null"], format: date-time }
        version: { type: ["string", "null"] }
        purpose: { type: ["string", "null"] }

    ConsentGrantResponse:
      type: object
      required: [id, purpose, version, grantedAt]
      properties:
        id: { type: integer }
        purpose: { type: string }
        version: { type: string }
        grantedAt: { type: string, format: date-time }

    DeletionRequestItem:
      type: object
      required: [id, userId, userName, userEmail, requestedAt, status]
      properties:
        id: { type: integer }
        userId: { type: integer }
        userName: { type: string }
        userEmail: { type: string }
        requestedAt: { type: string, format: date-time }
        approvedAt: { type: ["string", "null"], format: date-time }
        cancelledAt: { type: ["string", "null"], format: date-time }
        approvedBy: { type: ["integer", "null"] }
        notes: { type: ["string", "null"] }
        status: { type: string, enum: [pending, approved, cancelled] }

    AccessLogItem:
      type: object
      required: [id, accessorUserId, accessorName, accessorRole, patientId, patientName, fieldsAccessed, accessedAt]
      properties:
        id: { type: integer }
        accessorUserId: { type: integer }
        accessorName: { type: string }
        accessorRole: { type: string }
        patientId: { type: integer }
        patientName: { type: string }
        clinicId: { type: ["integer", "null"] }
        fieldsAccessed: { type: array, items: { type: string } }
        accessedAt: { type: string, format: date-time }

    AuditFailureItem:
      type: object
      required: [id, fieldsAccessed, failedAt]
      properties:
        id: { type: integer }
        clinicId: { type: ["integer", "null"] }
        accessorUserId: { type: ["integer", "null"] }
        accessorName: { type: ["string", "null"] }
        accessorRole: { type: ["string", "null"] }
        patientId: { type: ["integer", "null"] }
        fieldsAccessed: { type: array, items: { type: string } }
        errorMessage: { type: ["string", "null"] }
        failedAt: { type: string, format: date-time }
        resolvedAt: { type: ["string", "null"], format: date-time }
        resolvedBy: { type: ["integer", "null"] }
        ownerNotifiedAt: { type: ["string", "null"], format: date-time, description: "Timestamp when the clinic owner was sent an email alert about this audit failure" }

    AuditFailuresSummary:
      type: object
      required: [count, recent]
      properties:
        count: { type: integer, description: "Total number of unresolved failed audit write attempts for this clinic" }
        recent:
          type: array
          items:
            $ref: "#/components/schemas/AuditFailureItem"

    Contract:
      type: object
      required: [id, clinicId, patientId, title, termsContent, periodStart, periodEnd, totalValueCents, status, createdAt, updatedAt]
      properties:
        id: { type: integer }
        clinicId: { type: integer }
        patientId: { type: integer }
        title: { type: string }
        termsContent: { type: string }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        totalValueCents: { type: integer, description: "Total contract value in cents (e.g. 10000 = R$100,00)" }
        status:
          type: string
          enum: [pending_signature, signed, deleted]
        signatureImageUrl: { type: ["string", "null"], description: "Object storage path for the signature image" }
        signedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateContractInput:
      type: object
      required: [title, termsContent, periodStart, periodEnd, totalValueCents]
      properties:
        title: { type: string, minLength: 1 }
        termsContent: { type: string, minLength: 1 }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        totalValueCents: { type: integer, minimum: 0 }

    SignContractInput:
      type: object
      required: [signatureImageBase64]
      properties:
        signatureImageBase64: { type: string, description: "Base64-encoded PNG image of the finger-drawn signature" }

    # ─── Forms schemas ──────────────────────────────────────────────────────────

    FormQuestion:
      type: object
      required: [id, formId, text, questionType, orderIndex]
      properties:
        id: { type: integer }
        formId: { type: integer }
        text: { type: string }
        questionType:
          type: string
          enum: [yes_no, text, multiple_choice]
        options:
          type: ["array", "null"]
          items: { type: string }
        orderIndex: { type: integer }

    FormSummary:
      type: object
      required: [id, clinicId, title, isMandatory, isActive, questionCount, responseCount, createdAt]
      properties:
        id: { type: integer }
        clinicId: { type: integer }
        title: { type: string }
        description: { type: ["string", "null"] }
        isMandatory: { type: boolean }
        isActive: { type: boolean }
        questionCount: { type: integer }
        responseCount: { type: integer }
        createdAt: { type: string, format: date-time }

    FormDetail:
      type: object
      required: [id, clinicId, title, isMandatory, isActive, questions, createdAt]
      properties:
        id: { type: integer }
        clinicId: { type: integer }
        title: { type: string }
        description: { type: ["string", "null"] }
        isMandatory: { type: boolean }
        isActive: { type: boolean }
        questions:
          type: array
          items:
            $ref: "#/components/schemas/FormQuestion"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateFormInput:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        isMandatory: { type: boolean, default: false }
        isActive: { type: boolean, default: true }

    UpdateFormInput:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        description: { type: ["string", "null"] }
        isMandatory: { type: boolean }
        isActive: { type: boolean }

    UpdateFormQuestionInput:
      type: object
      properties:
        text: { type: string, minLength: 1 }
        orderIndex: { type: integer }
        questionType:
          type: string
          enum: [yes_no, text, multiple_choice]
        options:
          type: [array, "null"]
          items: { type: string }
          description: At least two distinct non-empty alternatives for multiple_choice. Cleared for other types. Alternatives cannot contain |.

    CreateFormQuestionInput:
      type: object
      required: [text, questionType]
      properties:
        text: { type: string, minLength: 1 }
        questionType:
          type: string
          enum: [yes_no, text, multiple_choice]
        options:
          type: array
          items: { type: string }
          description: At least two distinct non-empty alternatives required when questionType is multiple_choice. Alternatives cannot contain |.
        orderIndex: { type: integer }

    AssignFormInput:
      type: object
      properties:
        patientId:
          type: ["integer", "null"]
          description: Patient to assign the form to. Null means assign to all current patients in the clinic.

    PatientFormStatus:
      type: object
      required: [formId, title, isMandatory, isActive, answered]
      properties:
        formId: { type: integer }
        title: { type: string }
        description: { type: ["string", "null"] }
        isMandatory: { type: boolean }
        isActive: { type: boolean }
        answered: { type: boolean }
        submittedAt: { type: ["string", "null"], format: date-time }
        questions:
          type: array
          items:
            $ref: "#/components/schemas/FormQuestion"

    SubmitFormResponseInput:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items:
            type: object
            required: [questionId, answer]
            properties:
              questionId: { type: integer }
              answer: { type: string }

    FormResponseDetail:
      type: object
      required: [id, formId, patientId, submittedAt, answers]
      properties:
        id: { type: integer }
        formId: { type: integer }
        patientId: { type: integer }
        submittedAt: { type: string, format: date-time }
        answers:
          type: array
          items:
            type: object
            required: [questionId, questionText, questionType, answer]
            properties:
              questionId: { type: integer }
              questionText: { type: string }
              questionType:
                type: string
                enum: [yes_no, text, multiple_choice]
              answer: { type: string }

    # ─── Care Packages schemas ────────────────────────────────────────────────

    CarePackageSlot:
      type: object
      required: [id, packageId, doctorId, specialty, quantity]
      properties:
        id: { type: integer }
        packageId: { type: integer }
        doctorId: { type: ["integer", "null"] }
        specialty: { type: string }
        quantity: { type: integer }

    PublicCarePackageSlot:
      type: object
      required: [doctorName, specialty, quantity]
      properties:
        doctorName: { type: ["string", "null"] }
        specialty: { type: string }
        quantity: { type: integer }

    PublicCarePackage:
      type: object
      required: [name, description, durationDays, priceCents, clinicName, clinicLogoUrl, primaryColor, clinicPageSlug, images, slots]
      properties:
        name: { type: string }
        description: { type: ["string", "null"] }
        durationDays: { type: integer }
        priceCents: { type: integer }
        clinicName: { type: string }
        clinicLogoUrl: { type: ["string", "null"] }
        primaryColor: { type: ["string", "null"] }
        clinicPageSlug: { type: ["string", "null"] }
        images:
          type: array
          items:
            type: object
            required: [url, caption]
            properties:
              url: { type: string }
              caption: { type: ["string", "null"] }
        slots:
          type: array
          items:
            $ref: "#/components/schemas/PublicCarePackageSlot"

